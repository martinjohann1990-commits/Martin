<!doctype html>
<html lang="de" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlowStock — Cashflow &amp; Bestands-Dashboard</title>
<meta name="description" content="FlowStock: Offline Cashflow- und Bestands-Dashboard für E-Commerce-Händler. CSV hochladen, alles läuft lokal im Browser.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232a78d6'/%3E%3Cpath d='M9 21.5V15h3.4v6.5H9Zm5.3 0V10h3.4v11.5h-3.4Zm5.3 0v-9h3.4v9h-3.4Z' fill='%23fff'/%3E%3C/svg%3E">
<style>
/* ============================================================
   FlowStock — design tokens
   Chart palette + chrome from the validated reference palette.
   Light values on :root, dark values under BOTH the OS media
   query and the [data-theme="dark"] scope so the toggle wins.
   ============================================================ */
:root{
  color-scheme: light;
  --page:#f9f9f7;
  --surface:#fcfcfb;
  --surface-2:#f2f1ed;
  --ink:#0b0b0b;
  --ink-2:#52514e;
  --muted:#898781;
  --grid:#e1e0d9;
  --axis:#c3c2b7;
  --border:rgba(11,11,11,.10);
  --border-strong:rgba(11,11,11,.18);
  --shadow:0 1px 2px rgba(11,11,11,.05), 0 8px 24px -16px rgba(11,11,11,.25);
  --s1:#2a78d6;   /* categorical slot 1 — blue */
  --s2:#eb6834;   /* categorical slot 2 — orange */
  --s3:#1baf7a;   /* categorical slot 3 — aqua */
  --seq-100:#cde2fb; --seq-250:#86b6ef; --seq-450:#2a78d6; --seq-600:#184f95;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --good-ink:#006300; --critical-ink:#b32c2c;
  --focus:#2a78d6;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --page:#0d0d0d;
    --surface:#1a1a19;
    --surface-2:#232322;
    --ink:#ffffff;
    --ink-2:#c3c2b7;
    --muted:#898781;
    --grid:#2c2c2a;
    --axis:#383835;
    --border:rgba(255,255,255,.10);
    --border-strong:rgba(255,255,255,.18);
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70;
    --seq-100:#184f95; --seq-250:#1c5cab; --seq-450:#3987e5; --seq-600:#86b6ef;
    --good-ink:#0ca30c; --critical-ink:#e06060;
    --focus:#3987e5;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --page:#0d0d0d;
  --surface:#1a1a19;
  --surface-2:#232322;
  --ink:#ffffff;
  --ink-2:#c3c2b7;
  --muted:#898781;
  --grid:#2c2c2a;
  --axis:#383835;
  --border:rgba(255,255,255,.10);
  --border-strong:rgba(255,255,255,.18);
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --seq-100:#184f95; --seq-250:#1c5cab; --seq-450:#3987e5; --seq-600:#86b6ef;
  --good-ink:#0ca30c; --critical-ink:#e06060;
  --focus:#3987e5;
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--page);
  color:var(--ink);
  font:400 15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
[hidden]{display:none !important}

/* ---------- layout ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}
.topbar{
  position:sticky;top:0;z-index:40;
  background:color-mix(in srgb,var(--page) 88%,transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}
.topbar-in{display:flex;align-items:center;gap:12px;height:60px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand-mark{width:28px;height:28px;border-radius:7px;background:var(--s1);display:grid;place-items:center;flex:none}
.brand-mark svg{display:block}
.brand-name{font-weight:650;letter-spacing:-.02em;font-size:17px}
.brand-tag{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:860px){.brand-tag{display:none}}

/* ---------- controls ---------- */
.btn{
  appearance:none;border:1px solid var(--border-strong);background:var(--surface);
  color:var(--ink);border-radius:9px;padding:8px 13px;font-size:14px;font-weight:500;
  cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;
  transition:background .12s ease,border-color .12s ease,transform .06s ease;
}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn-primary:hover{background:var(--ink-2);border-color:var(--ink-2)}
.btn-ghost{border-color:transparent;background:transparent}
.btn-ghost:hover{background:var(--surface-2)}
.btn-sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn-icon{padding:7px;border-radius:9px}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{
  appearance:none;border:0;background:transparent;padding:7px 11px;font-size:13px;font-weight:500;
  cursor:pointer;color:var(--ink-2);
}
.seg button+button{border-left:1px solid var(--border)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--ink-2);letter-spacing:.01em}
.field .hint{font-size:12px;color:var(--muted);font-weight:400}
input[type=text],input[type=number],input[type=date],select{
  border:1px solid var(--border-strong);background:var(--surface);border-radius:9px;
  padding:8px 10px;font-size:14px;width:100%;min-width:0;
}
input[type=number]{font-variant-numeric:tabular-nums}
select{cursor:pointer}

/* ---------- cards ---------- */
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--shadow);
}
.card-head{display:flex;align-items:flex-start;gap:12px;padding:16px 18px 0}
.card-head .titles{margin-right:auto;min-width:0}
.card-title{font-size:15px;font-weight:600}
.card-sub{font-size:13px;color:var(--muted);margin-top:2px}
.card-body{padding:14px 18px 18px}

/* ---------- landing ---------- */
.hero-land{padding:44px 0 12px;text-align:center}
.hero-land h1{font-size:clamp(30px,5vw,44px);letter-spacing:-.03em;line-height:1.1}
.hero-land p.lede{margin:14px auto 0;max-width:56ch;color:var(--ink-2);font-size:17px}
.badges{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:20px}
.badge{
  display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);
  border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:5px 12px;
}
.drop{
  margin:28px 0 0;border:2px dashed var(--border-strong);border-radius:16px;background:var(--surface);
  padding:34px 24px;text-align:center;transition:border-color .12s ease,background .12s ease;
}
.drop.is-over{border-color:var(--s1);background:color-mix(in srgb,var(--s1) 7%,var(--surface))}
.drop h3{font-size:18px}
.drop p{color:var(--ink-2);margin-top:6px;font-size:14px}
.drop-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:18px}
.upload-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
@media (max-width:760px){.upload-grid{grid-template-columns:1fr}}
.file-slot{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:var(--surface);font-size:13px}
.file-slot .dot{width:8px;height:8px;border-radius:50%;background:var(--axis);flex:none}
.file-slot.is-set .dot{background:var(--good)}
.file-slot .nm{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:auto}
.features{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:40px 0 10px}
@media (max-width:860px){.features{grid-template-columns:1fr}}
.feature h4{font-size:15px;margin-bottom:6px}
.feature p{color:var(--ink-2);font-size:14px}
.feature .ic{width:32px;height:32px;border-radius:9px;background:var(--surface-2);display:grid;place-items:center;margin-bottom:10px;color:var(--s1)}

/* ---------- filter row ---------- */
.filters{
  display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;
  padding:14px 16px;background:var(--surface);border:1px solid var(--border);
  border-radius:14px;box-shadow:var(--shadow);margin-bottom:18px;
}
.filters .grow{flex:1 1 180px}
.filters .spacer{flex:1 1 auto}

/* ---------- stat tiles ---------- */
.hero-figure{
  display:flex;flex-wrap:wrap;align-items:flex-end;gap:18px 28px;
  padding:20px 22px;margin-bottom:16px;
}
.hero-figure .lab{font-size:13px;color:var(--ink-2);font-weight:600}
.hero-figure .val{font-size:clamp(40px,6vw,56px);font-weight:650;letter-spacing:-.03em;line-height:1.05;margin-top:4px}
.hero-figure .sub{font-size:13px;color:var(--muted);margin-top:6px;max-width:46ch}
.hero-side{display:flex;gap:26px;margin-left:auto;flex-wrap:wrap}
.hero-side .k{font-size:12px;color:var(--muted);font-weight:600}
.hero-side .v{font-size:20px;font-weight:600;margin-top:2px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:18px}
.tile{padding:14px 16px}
.tile .lab{font-size:12.5px;color:var(--ink-2);font-weight:600}
.tile .val{font-size:26px;font-weight:600;letter-spacing:-.02em;margin-top:6px;line-height:1.15}
.tile .delta{font-size:12.5px;margin-top:5px;display:flex;align-items:center;gap:5px;color:var(--muted)}
.delta.up{color:var(--good-ink)}
.delta.down{color:var(--critical-ink)}

/* ---------- charts ---------- */
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px}
.chart-grid.full{grid-template-columns:1fr}
@media (max-width:960px){.chart-grid{grid-template-columns:1fr}}
.chart-wrap{position:relative}
svg.chart{display:block;width:100%;height:auto;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px}
.legend .item{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2)}
.legend .sw{width:11px;height:11px;border-radius:3px;flex:none}
.legend .sw.line{height:3px;border-radius:2px;width:16px}
.axis-txt{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.grid-line{stroke:var(--grid);stroke-width:1;shape-rendering:crispEdges}
.axis-line{stroke:var(--axis);stroke-width:1;shape-rendering:crispEdges}
.dir-label{fill:var(--ink-2);font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
.hit{fill:transparent;cursor:pointer}
.tip{
  position:absolute;z-index:20;pointer-events:none;opacity:0;transform:translate(-50%,-100%);
  background:var(--surface);border:1px solid var(--border-strong);border-radius:10px;
  box-shadow:0 6px 24px -8px rgba(0,0,0,.35);padding:9px 11px;font-size:12.5px;min-width:132px;
  transition:opacity .1s ease;
}
.tip.on{opacity:1}
.tip .t-head{font-weight:600;margin-bottom:6px;font-size:12.5px}
.tip .t-row{display:flex;align-items:center;gap:8px;margin-top:3px;white-space:nowrap}
.tip .t-row .sw{width:9px;height:9px;border-radius:3px;flex:none}
.tip .t-row .k{color:var(--ink-2);margin-right:auto}
.tip .t-row .v{font-variant-numeric:tabular-nums;font-weight:600}
.tip .t-sep{height:1px;background:var(--border);margin:6px 0}

/* ---------- tables ---------- */
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.data{width:100%;border-collapse:collapse;font-size:13.5px}
table.data th,table.data td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
table.data th{
  font-size:12px;font-weight:600;color:var(--ink-2);position:sticky;top:0;background:var(--surface);
  border-bottom:1px solid var(--border-strong);
}
table.data th.sortable{cursor:pointer;user-select:none}
table.data th.sortable:hover{color:var(--ink)}
table.data th .arrow{opacity:.45;font-size:10px}
table.data td.num,table.data th.num{text-align:right;font-variant-numeric:tabular-nums}
table.data tbody tr:hover{background:var(--surface-2)}
table.data td.name{white-space:normal;min-width:180px}
.pill{
  display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
  border-radius:999px;padding:3px 9px;border:1px solid var(--border-strong);color:var(--ink);
}
.pill .ic{font-size:11px;line-height:1}
.pill.critical{background:color-mix(in srgb,var(--critical) 16%,var(--surface));border-color:color-mix(in srgb,var(--critical) 45%,var(--border-strong))}
.pill.serious{background:color-mix(in srgb,var(--serious) 18%,var(--surface));border-color:color-mix(in srgb,var(--serious) 45%,var(--border-strong))}
.pill.warning{background:color-mix(in srgb,var(--warning) 20%,var(--surface));border-color:color-mix(in srgb,var(--warning) 50%,var(--border-strong))}
.pill.good{background:color-mix(in srgb,var(--good) 14%,var(--surface));border-color:color-mix(in srgb,var(--good) 40%,var(--border-strong))}
.empty{padding:34px 18px;text-align:center;color:var(--muted);font-size:14px}

/* ---------- dialog / drawer ---------- */
dialog.sheet{
  border:1px solid var(--border);border-radius:16px;padding:0;background:var(--surface);color:var(--ink);
  max-width:640px;width:calc(100vw - 32px);box-shadow:0 24px 60px -20px rgba(0,0,0,.5);
}
dialog.sheet::backdrop{background:rgba(11,11,11,.45)}
.sheet-head{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--border)}
.sheet-head h2{font-size:17px;margin-right:auto}
.sheet-body{padding:18px;max-height:min(70vh,620px);overflow:auto}
.sheet-foot{display:flex;gap:10px;justify-content:flex-end;padding:14px 18px;border-top:1px solid var(--border)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.form-grid{grid-template-columns:1fr}}
.form-grid .full{grid-column:1/-1}
.sec-title{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.sec-title:first-child{margin-top:0}
.map-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center;margin-bottom:9px}
.map-row .lab{font-size:13px;color:var(--ink-2)}
.map-row .lab .req{color:var(--critical-ink);font-weight:700}
.prose{font-size:14px;color:var(--ink-2);line-height:1.65}
.prose h3{font-size:15px;color:var(--ink);margin:18px 0 6px}
.prose h3:first-child{margin-top:0}
.prose ul{margin:6px 0;padding-left:20px}
.prose li{margin:3px 0}
.prose code{background:var(--surface-2);padding:1px 5px;border-radius:5px;font-size:12.5px}
.prose strong{color:var(--ink)}

/* ---------- misc ---------- */
.notice{
  display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:11px;font-size:13.5px;
  border:1px solid var(--border-strong);background:var(--surface-2);color:var(--ink-2);
}
.notice.err{border-color:color-mix(in srgb,var(--critical) 45%,var(--border-strong));background:color-mix(in srgb,var(--critical) 10%,var(--surface))}
.notice .ic{flex:none;margin-top:1px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.foot{padding:34px 0 40px;color:var(--muted);font-size:13px;text-align:center}
.foot a{color:var(--ink-2)}
.tabs{display:inline-flex;gap:2px;background:var(--surface-2);border-radius:9px;padding:3px}
.tabs button{appearance:none;border:0;background:transparent;padding:5px 11px;border-radius:7px;font-size:13px;cursor:pointer;color:var(--ink-2);font-weight:500}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
@media print{
  .topbar,.filters,.no-print{display:none !important}
  body{background:#fff}
  .card{break-inside:avoid;box-shadow:none}
}
</style>
</head>
<body>
<header class="topbar no-print">
  <div class="wrap topbar-in">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 32 32" fill="#fff"><path d="M9 21.5V15h3.4v6.5H9Zm5.3 0V10h3.4v11.5h-3.4Zm5.3 0v-9h3.4v9h-3.4Z"/></svg>
      </span>
      <span class="brand-name">FlowStock</span>
      <span class="brand-tag" data-i18n="app.tagline"></span>
    </div>

    <button class="btn btn-sm" id="btn-settings" hidden>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 7 19.4a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0-1.2-2.9H1a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 2.6 7a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H7a1.7 1.7 0 0 0 1-1.5V1a2 2 0 1 1 4 0v.1A1.7 1.7 0 0 0 15 2.6a1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V7a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z" transform="translate(1 1) scale(0.92)"/></svg>
      <span data-i18n="nav.settings"></span>
    </button>

    <button class="btn btn-sm" id="btn-reset" hidden>
      <span data-i18n="nav.newFile"></span>
    </button>

    <div class="seg" role="group" aria-label="Sprache / Language">
      <button type="button" id="lang-de" data-lang="de">DE</button>
      <button type="button" id="lang-en" data-lang="en">EN</button>
    </div>

    <button class="btn btn-icon btn-sm" id="btn-theme" aria-label="Theme">
      <svg id="ic-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg>
      <svg id="ic-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true" hidden><path d="M20 13.5A8 8 0 0 1 10.5 4a8.2 8.2 0 0 0-1 4 8 8 0 0 0 8 8 8.2 8.2 0 0 0 2.5-.4Z"/></svg>
    </button>

    <button class="btn btn-icon btn-sm" id="btn-about" aria-label="Info">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><circle cx="12" cy="12" r="9.2"/><path d="M12 11v5.5M12 7.6v.9"/></svg>
    </button>
  </div>
</header>

<main>
<!-- =========================== LANDING =========================== -->
<section id="view-landing" class="wrap">
  <div class="hero-land">
    <h1 data-i18n="landing.title"></h1>
    <p class="lede" data-i18n="landing.lede"></p>
    <div class="badges">

function t(key, vars) {
  const dict = I18N[LANG] || I18N.de;
  let s = dict[key];
  if (s === undefined) s = (I18N.en[key] !== undefined ? I18N.en[key] : key);
  if (vars) {
    for (const k in vars) s = s.split("{" + k + "}").join(String(vars[k]));
  }
  return s;
}

function localeTag() { return LANG === "de" ? "de-DE" : "en-US"; }
