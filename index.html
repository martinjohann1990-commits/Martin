<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f1115">
<title>NetPlan+ &ndash; Logistiknetzwerk-Analyse</title>
<link rel="icon" href="data:,">
<script>
(function () {
  try {
    var saved = window.localStorage.getItem('lnp.theme');
    var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  } catch (e) { /* file:// / restrictive settings: keep default light */ }
})();
</script>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="vendor/leaflet.css">
</head>
<body>

<div class="app" id="app">

  <aside class="sidebar" id="sidebar">
    <div class="brand" id="brandBlock">
      <div class="brand-mark" id="brandMark">NP</div>
      <div class="brand-text">
        <div class="brand-name" id="brandName">NetPlan+</div>
        <div class="brand-sub" id="brandSub" data-t="Logistiknetzwerk-Analyse">Logistiknetzwerk-Analyse</div>
      </div>
    </div>
    <nav class="nav" id="mainNav">
      <button class="nav-item active" data-view="dashboard"><span class="nav-ic">&#9635;</span><span data-t="Dashboard">Dashboard</span></button>
      <button class="nav-item" data-view="data"><span class="nav-ic">&#8613;</span><span data-t="Daten &amp; Import">Daten &amp; Import</span></button>
      <button class="nav-item" data-view="dcs"><span class="nav-ic">&#9632;</span><span data-t="DC-Verwaltung">DC-Verwaltung</span></button>
      <button class="nav-item" data-view="simulation"><span class="nav-ic">&#9881;</span><span data-t="Simulation">Simulation</span></button>
      <button class="nav-item" data-view="scenarios"><span class="nav-ic">&#8942;</span><span data-t="Szenarien">Szenarien</span></button>
      <button class="nav-item" data-view="reports"><span class="nav-ic">&#9776;</span><span data-t="Berichte">Berichte</span></button>
      <button class="nav-item" data-view="export"><span class="nav-ic">&#8615;</span><span data-t="Export &amp; Projekt">Export &amp; Projekt</span></button>
    </nav>
    <div class="sidebar-foot">
      <div class="foot-line" id="dataStatusLine">0 <span data-t="Datensätze">Datensätze</span></div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="menuToggle" aria-label="Menu">&#9776;</button>
      <div class="topbar-title" id="viewTitle" data-t="Dashboard">Dashboard</div>
      <div class="topbar-spacer"></div>
      <button class="btn btn-ghost" id="demoBtn" data-t="Demodaten laden">Demodaten laden</button>
      <button class="icon-btn" id="langToggle" title="Sprache / Language">DE</button>
      <button class="icon-btn" id="themeToggle" title="Theme">&#9788;</button>
    </header>

    <main class="content" id="content">
      <div class="view" id="view-dashboard"></div>
      <div class="view" id="view-data" hidden></div>
      <div class="view" id="view-dcs" hidden></div>
      <div class="view" id="view-simulation" hidden></div>
      <div class="view" id="view-scenarios" hidden></div>
      <div class="view" id="view-reports" hidden></div>
      <div class="view" id="view-export" hidden></div>
    </main>
  </div>
</div>

<div class="toast-stack" id="toastStack"></div>
<div class="modal-root" id="modalRoot" hidden></div>
<div class="print-area" id="printArea"></div>

<!-- Vendor libraries: bundled locally under /vendor (spec §3 "alles clientseitig, Bibliotheken
     lokal eingebunden") — no CDN dependency at runtime, works fully offline once deployed. -->
<script src="vendor/papaparse.min.js"></script>
<script src="vendor/xlsx.core.min.js"></script>
<script src="vendor/chart.umd.js"></script>
<script src="vendor/leaflet.js"></script>
<script src="vendor/leaflet-heat.js"></script>

<!-- Application modules: plain scripts, single global namespace window.LNP -->
<script src="js/i18n.js"></script>
<script src="js/util.js"></script>
<script src="js/ui.js"></script>
<script src="js/geo.js"></script>
<script src="js/state.js"></script>
<script src="js/importer.js"></script>
<script src="js/sim.js"></script>
<script src="js/charts.js"></script>
<script src="js/mapview.js"></script>
<script src="js/demo.js"></script>
<script src="js/views/dashboard.js"></script>
<script src="js/views/data.js"></script>
<script src="js/views/dcs.js"></script>
<script src="js/views/simulation.js"></script>
<script src="js/views/scenarios.js"></script>
<script src="js/views/reports.js"></script>
<script src="js/views/exportProject.js"></script>
<script src="js/app.js"></script>
</body>
</html>
