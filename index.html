/* ---------- delimiter sniffing ---------- */
function detectDelimiter(text) {
  const sample = text.slice(0, 64 * 1024).split(/\r?\n/).slice(0, 20);
  const cands = [",", ";", "\t", "|"];
  let best = ",", bestScore = -1;
  for (const d of cands) {
    const counts = sample
      .filter(l => l.trim() !== "")
      .map(l => countOutsideQuotes(l, d));
    if (!counts.length) continue;
    const max = Math.max(...counts);
    if (max === 0) continue;
    // prefer the delimiter with the highest, most consistent field count
    const mode = counts.reduce((a, c) => (a[c] = (a[c] || 0) + 1, a), {});
    const consistency = Math.max(...Object.values(mode)) / counts.length;
    const score = max * consistency;
    if (score > bestScore) { bestScore = score; best = d; }
  }
  return best;
}

function countOutsideQuotes(line, d) {
  let n = 0, q = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') { if (q && line[i + 1] === '"') i++; else q = !q; }
    else if (c === d && !q) n++;
  }
  return n;
}

/* ---------- RFC4180-ish parser ---------- */
function parseCSV(text, delimiter) {
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const d = delimiter || detectDelimiter(text);
  const rows = [];
  let row = [], field = "", q = false, started = false;

  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else q = false;
      } else field += c;
      continue;
    }
    if (c === '"' && field.trim() === "") { q = true; started = true; continue; }
    if (c === d) { row.push(field); field = ""; started = true; continue; }
    if (c === "\r") continue;
    if (c === "\n") {
      row.push(field);
      if (started || row.length > 1 || row[0].trim() !== "") rows.push(row);
      row = []; field = ""; started = false;
      continue;
    }
    field += c;
    started = true;
  }
  row.push(field);
  if (started || row.length > 1) rows.push(row);

  if (!rows.length) return { headers: [], rows: [], delimiter: d };

  const headers = rows[0].map((h, i) => {
    const clean = String(h).trim();
    return clean === "" ? "column_" + (i + 1) : clean;
  });
  const body = [];
  for (let r = 1; r < rows.length; r++) {
    const raw = rows[r];
    if (raw.length === 1 && String(raw[0]).trim() === "") continue;
    const obj = {};
    for (let c = 0; c < headers.length; c++) obj[headers[c]] = raw[c] === undefined ? "" : String(raw[c]).trim();
    body.push(obj);
  }
  return { headers, rows: body, delimiter: d };
}

/* ---------- number coercion ---------- */
function parseNumber(input) {
  if (input === null || input === undefined) return null;
  if (typeof input === "number") return isFinite(input) ? input : null;
  let s = String(input).trim();
  if (s === "" || s === "-" || s === "—" || s === "n/a" || s === "N/A") return null;

  let negative = false;
  if (/^\(.*\)$/.test(s)) { negative = true; s = s.slice(1, -1); }
  s = s.replace(/[\s  ]/g, "");
  s = s.replace(/[^0-9,.\-+]/g, "");        // drop currency symbols and letters
  if (s.startsWith("-")) { negative = !negative; s = s.slice(1); }
  else if (s.startsWith("+")) s = s.slice(1);
  if (s.endsWith("-")) { negative = !negative; s = s.slice(0, -1); }
  if (s === "") return null;

  const lastComma = s.lastIndexOf(",");
  const lastDot = s.lastIndexOf(".");
  let decimalSep = "";
  if (lastComma !== -1 && lastDot !== -1) {
    decimalSep = lastComma > lastDot ? "," : ".";
  } else if (lastComma !== -1) {
    const after = s.length - lastComma - 1;
    const occurrences = s.split(",").length - 1;
    decimalSep = (occurrences === 1 && after !== 3) ? "," : "";
  } else if (lastDot !== -1) {
    const after = s.length - lastDot - 1;
    const occurrences = s.split(".").length - 1;
    decimalSep = (occurrences === 1 && after !== 3) ? "." : "";
  }

  let intPart, fracPart = "";
  if (decimalSep) {
    const idx = decimalSep === "," ? lastComma : lastDot;
    intPart = s.slice(0, idx);
    fracPart = s.slice(idx + 1);
  } else {
    intPart = s;
  }
  intPart = intPart.replace(/[.,]/g, "");
  fracPart = fracPart.replace(/[.,]/g, "");
  const val = Number(intPart + (fracPart ? "." + fracPart : ""));
  if (!isFinite(val)) return null;
  return negative ? -val : val;
}

/* ---------- date coercion ---------- */
const MONTH_NAMES = {
  jan: 0, januar: 0, january: 0, jän: 0,
  feb: 1, februar: 1, february: 1,
  mar: 2, mär: 2, maerz: 2, "märz": 2, march: 2, mrz: 2,
  apr: 3, april: 3,
  mai: 4, may: 4,
  jun: 5, juni: 5, june: 5,
  jul: 6, juli: 6, july: 6,
  aug: 7, august: 7,
  sep: 8, sept: 8, september: 8,
  okt: 9, oct: 9, oktober: 9, october: 9,
  nov: 10, november: 10,
  dez: 11, dec: 11, dezember: 11, december: 11
};

/** Returns {y,m,d} parts or null, without deciding day/month order. */
function dateParts(input) {
  if (input === null || input === undefined) return null;
  let s = String(input).trim();
  if (!s) return null;
  s = s.split(/[T ]/)[0].replace(/,/g, " ").trim();     // drop time part

  let m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})$/);
  if (m) return { y: +m[1], a: +m[2], b: +m[3], order: "ymd" };

  m = s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})$/);
  if (m) {
    let y = +m[3];
    if (y < 100) y += y < 70 ? 2000 : 1900;
    return { y, a: +m[1], b: +m[2], order: "amb" };
  }

  // "12 Mar 2024" / "March 12 2024" / "12. März 2024"
  const words = s.replace(/\./g, " ").split(/\s+/).filter(Boolean);
  if (words.length >= 3) {
    let day = null, mon = null, year = null;
    for (const w of words) {
      const key = w.toLowerCase().replace(/[^a-zäöüß]/g, "");
      if (key && MONTH_NAMES[key] !== undefined) { mon = MONTH_NAMES[key]; continue; }
      const n = parseInt(w, 10);
      if (isNaN(n)) continue;
      if (n > 31 || w.length === 4) year = n;
      else if (day === null) day = n;
    }
    if (mon !== null && day !== null && year !== null) return { y: year, a: day, b: mon + 1, order: "dmy" };
  }
  return null;
}

/**
 * Decides day-first vs month-first for a whole column, then parses.
 * Returns a function(value) -> Date|null.
 */
function makeDateParser(values) {
  let dayFirstVotes = 0, monthFirstVotes = 0;
  for (const v of values) {
    const p = dateParts(v);
    if (!p || p.order !== "amb") continue;
    if (p.a > 12 && p.b <= 12) dayFirstVotes++;
    else if (p.b > 12 && p.a <= 12) monthFirstVotes++;
  }
  let dayFirst;
  if (dayFirstVotes || monthFirstVotes) dayFirst = dayFirstVotes >= monthFirstVotes;
  else {
    // no disambiguating sample: dotted dates are day-first, slashed are month-first
    const sample = values.find(v => dateParts(v) && dateParts(v).order === "amb") || "";
    dayFirst = String(sample).indexOf(".") !== -1 || LANG === "de";
  }
  return function (value) {
    const p = dateParts(value);
    if (!p) return null;
    let y = p.y, mo, dd;
    if (p.order === "ymd") { mo = p.a; dd = p.b; }
    else if (p.order === "dmy") { dd = p.a; mo = p.b; }
    else if (dayFirst) { dd = p.a; mo = p.b; }
    else { mo = p.a; dd = p.b; }
    if (mo < 1 || mo > 12 || dd < 1 || dd > 31 || y < 1970 || y > 2200) return null;
    const dt = new Date(y, mo - 1, dd);
    return isNaN(dt.getTime()) ? null : dt;
  };
}

/* ---------- column detection ---------- */
function normHeader(h) {
  return String(h).toLowerCase()
    .replace(/ä/g, "a").replace(/ö/g, "o").replace(/ü/g, "u").replace(/ß/g, "ss")
    .replace(/[^a-z0-9]+/g, " ")
    .trim();
}

/* Aliases are matched in order: exact normalised match wins over contains. */
const FIELD_ALIASES = {
  date: ["sale date", "order date", "date", "datum", "bestelldatum", "verkaufsdatum", "date sold", "purchase date", "created at", "transaktionsdatum", "buchungstag", "day", "tag", "paid at", "zeitpunkt"],
  sku: ["sku", "artikelnummer", "artikel nr", "item id", "item number", "product id", "produkt id", "listing id", "variant sku", "asin", "ean", "artikelnr", "seller sku"],
  product: ["item name", "product name", "product title", "title", "produkt", "artikel", "artikelname", "bezeichnung", "name", "description", "beschreibung", "listing title"],
  qty: ["quantity", "qty", "menge", "anzahl", "number of items", "units", "stuckzahl", "stueckzahl", "stuck", "stueck", "items", "lineitem quantity"],
  revenue: ["item total", "line total", "order total", "revenue", "umsatz", "gesamt", "gesamtpreis", "total", "gross sales", "bruttoumsatz", "sales", "erlos", "betrag", "zeilensumme", "amount"],
  price: ["unit price", "price", "preis", "stuckpreis", "stueckpreis", "einzelpreis", "item price", "vk", "verkaufspreis", "lineitem price"],
  cost: ["unit cost", "cost of goods", "cogs", "cost", "kosten", "ek", "einkaufspreis", "einkauf", "wareneinsatz", "herstellkosten", "purchase price", "cost price"],
  /* German exports appear both with umlauts and with the "ue" transcription,
     so both spellings are listed rather than normalised away (stripping "ue"
     would wreck unrelated words). */
  fees: ["fees", "fee", "gebuhren", "gebuehren", "gebuhr", "gebuehr", "provision", "commission", "marketplace fee", "transaction fee", "verkaufsgebuhr", "verkaufsgebuehr", "fees taxes", "etsy fees", "processing fee"],
  shipping: ["shipping cost", "shipping", "versandkosten", "versand", "porto", "postage", "delivery cost", "shipping expense", "shipping paid"],
  shipRev: ["shipping income", "shipping revenue", "versanderlose", "versanderlos", "shipping charged", "versandeinnahmen"],
  discount: ["discount", "rabatt", "coupon", "gutschein", "nachlass", "discount amount"],
  channel: ["channel", "kanal", "marketplace", "marktplatz", "plattform", "platform", "shop", "store", "source", "quelle", "sales channel"],
  order: ["order id", "order number", "bestellnummer", "bestell nr", "auftragsnummer", "transaction id", "receipt id", "order"]
};

const INV_ALIASES = {
  sku: FIELD_ALIASES.sku,
  product: FIELD_ALIASES.product,
  stock: ["stock", "stock on hand", "on hand", "bestand", "lagerbestand", "inventory", "quantity on hand", "verfugbar", "available", "menge", "qty", "quantity", "bestandsmenge"],
  cost: FIELD_ALIASES.cost,
  lead: ["lead time", "lead time days", "lieferzeit", "lieferzeit tage", "wiederbeschaffungszeit", "replenishment time", "leadtime"],
  moq: ["moq", "minimum order quantity", "mindestbestellmenge", "min order", "mindestmenge", "abnahmemenge"],
  supplier: ["supplier", "lieferant", "vendor", "hersteller", "manufacturer"]
};

function detectColumns(headers, aliases) {
  const norm = headers.map(normHeader);
  const used = new Set();
  const out = {};
  // pass 1: exact match
  for (const field in aliases) {
    for (const alias of aliases[field]) {
      const idx = norm.findIndex((h, i) => h === alias && !used.has(i));
      if (idx !== -1) { out[field] = headers[idx]; used.add(idx); break; }
    }
  }
  // pass 2: substring match
  for (const field in aliases) {
    if (out[field]) continue;
    for (const alias of aliases[field]) {
      if (alias.length < 3) continue;
      const idx = norm.findIndex((h, i) => !used.has(i) && (h.indexOf(alias) !== -1 || alias.indexOf(h) !== -1 && h.length >= 3));
      if (idx !== -1) { out[field] = headers[idx]; used.add(idx); break; }
    }
  }
  return out;
}

/* ---------- CSV writing ---------- */
function toCSV(headerRow, dataRows, delimiter) {
  const d = delimiter || ";";
  const esc = v => {
    const s = v === null || v === undefined ? "" : String(v);
    return /["\n\r]/.test(s) || s.indexOf(d) !== -1 ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const lines = [headerRow.map(esc).join(d)];
  for (const r of dataRows) lines.push(r.map(esc).join(d));
  return "﻿" + lines.join("\r\n");
}

function downloadText(filename, text, mime) {
  const blob = new Blob([text], { type: (mime || "text/csv") + ";charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function readFileText(file) {
  return new Promise((resolve, reject) => {
    if (file.size > MAX_BYTES) { reject(new Error(t("err.tooBig"))); return; }
    const fr = new FileReader();
    fr.onerror = () => reject(new Error("read error"));
    fr.onload = () => resolve(String(fr.result || ""));
    fr.readAsText(file, "utf-8");
  });
}

/* ----- src/40-analytics.js ----- */
/* ============================================================
   Analytics — turns mapped CSV rows into the dashboard model.
   Pure functions over plain objects; no DOM access in here.
   ============================================================ */

const DAY_MS = 86400000;

/* ---------- formatting ---------- */
function fmtCurrency(v, opts) {
  if (v === null || v === undefined || !isFinite(v)) return t("ui.none");
  const o = opts || {};
  const abs = Math.abs(v);
  // `force` lets an axis compact every tick once its maximum warrants it,
  // so a scale never mixes "5,000" with "15K"
  const compact = o.compact && (o.force || abs >= 10000);
  // German compact notation does not abbreviate below a million, so a
  // fraction digit would leak into axis ticks — only allow one past 1M.
  const compactDigits = abs >= 1e6 ? 1 : 0;
  try {
    return new Intl.NumberFormat(localeTag(), {
      style: "currency",
      currency: STATE.settings.currency,
      notation: compact ? "compact" : "standard",
      maximumFractionDigits: compact ? compactDigits : (o.decimals !== undefined ? o.decimals : (abs >= 1000 ? 0 : 2)),
      minimumFractionDigits: compact ? 0 : (o.decimals !== undefined ? o.decimals : (abs >= 1000 ? 0 : 2))
    }).format(v);
  } catch (e) {
    return v.toFixed(2) + " " + STATE.settings.currency;
  }
}

function fmtNum(v, decimals) {
  if (v === null || v === undefined || !isFinite(v)) return t("ui.none");
  return new Intl.NumberFormat(localeTag(), {
    maximumFractionDigits: decimals === undefined ? 0 : decimals,
    minimumFractionDigits: decimals === undefined ? 0 : decimals
  }).format(v);
}

function fmtPct(v, decimals) {
  if (v === null || v === undefined || !isFinite(v)) return t("ui.none");
  return new Intl.NumberFormat(localeTag(), {
    style: "percent",
    maximumFractionDigits: decimals === undefined ? 1 : decimals,
    minimumFractionDigits: decimals === undefined ? 1 : decimals
  }).format(v);
}

function fmtSigned(v) {
  if (v === null || v === undefined || !isFinite(v)) return t("ui.none");
  const s = new Intl.NumberFormat(localeTag(), { style: "percent", maximumFractionDigits: 0, signDisplay: "exceptZero" });
  try { return s.format(v); } catch (e) { return (v >= 0 ? "+" : "") + Math.round(v * 100) + "%"; }
}

function fmtDate(d, style) {
  if (!d) return t("ui.none");
  const opts = style === "long"
    ? { year: "numeric", month: "short", day: "numeric" }
    : { month: "2-digit", day: "2-digit" };
  return new Intl.DateTimeFormat(localeTag(), opts).format(d);
}

function fmtISO(d) {
  if (!d) return "";
  const p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}

function startOfDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
function diffDays(a, b) { return Math.round((startOfDay(b) - startOfDay(a)) / DAY_MS); }

/* ---------- row normalisation ---------- */
function buildSalesRows(raw, map, settings) {
  const get = (row, field) => (map[field] ? row[map[field]] : undefined);
  const dateValues = raw.rows.map(r => get(r, "date"));
  const parseDateCol = makeDateParser(dateValues);

  const rows = [];
  let skipped = 0;
  let sawCost = false, sawFees = false, sawQty = false, sawOrder = false;

  for (const r of raw.rows) {
    const date = parseDateCol(get(r, "date"));
    if (!date) { skipped++; continue; }

    let qty = parseNumber(get(r, "qty"));
    if (qty === null) qty = 1; else sawQty = true;
    if (qty === 0) qty = 1;
    qty = Math.abs(qty);

    let revenue = parseNumber(get(r, "revenue"));
    const price = parseNumber(get(r, "price"));
    if (revenue === null && price !== null) revenue = price * qty;
    if (revenue === null) revenue = 0;

    const discount = parseNumber(get(r, "discount")) || 0;
    const shipRev = parseNumber(get(r, "shipRev")) || 0;
    revenue = revenue - Math.abs(discount) + shipRev;

    const unitCost = parseNumber(get(r, "cost"));
    if (unitCost !== null) sawCost = true;

    let fees = parseNumber(get(r, "fees"));
    if (fees !== null) { sawFees = true; fees = Math.abs(fees); }

    const shipping = Math.abs(parseNumber(get(r, "shipping")) || 0);

    const skuRaw = get(r, "sku");
    const nameRaw = get(r, "product");
    const sku = skuRaw !== undefined && String(skuRaw).trim() !== "" ? String(skuRaw).trim() : null;
    const name = nameRaw !== undefined && String(nameRaw).trim() !== "" ? String(nameRaw).trim() : null;
    const key = sku || name || "—";

    const channelRaw = get(r, "channel");
    const channel = channelRaw !== undefined && String(channelRaw).trim() !== "" ? String(channelRaw).trim() : null;

    const orderRaw = get(r, "order");
    const order = orderRaw !== undefined && String(orderRaw).trim() !== "" ? String(orderRaw).trim() : null;
    if (order) sawOrder = true;

    rows.push({
      date: startOfDay(date),
      ts: startOfDay(date).getTime(),
      key, sku, name: name || sku || "—",
      qty, revenue,
      unitCost,
      fees, shipping,
      channel, order
    });
  }

  rows.sort((a, b) => a.ts - b.ts);
  return { rows, skipped, sawCost, sawFees, sawQty, sawOrder };
}

function buildInventory(raw, map) {
  if (!raw || !map || !map.sku) return null;
  const byKey = {};
  for (const r of raw.rows) {
    const sku = String(r[map.sku] || "").trim();
    if (!sku) continue;
    const stock = parseNumber(map.stock ? r[map.stock] : null);
    byKey[sku] = {
      sku,
      name: map.product ? String(r[map.product] || "").trim() || null : null,
      stock: stock === null ? null : Math.max(0, stock),
      cost: parseNumber(map.cost ? r[map.cost] : null),
      lead: parseNumber(map.lead ? r[map.lead] : null),
      moq: parseNumber(map.moq ? r[map.moq] : null),
      supplier: map.supplier ? String(r[map.supplier] || "").trim() || null : null
    };
  }
  return Object.keys(byKey).length ? byKey : null;
}

/* ---------- effective per-row economics ---------- */
function rowEconomics(row, inv, settings) {
  const feeRate = settings.defaultFee / 100;
  const costRate = settings.defaultCost / 100;

  let unitCost = row.unitCost;
  if (unitCost === null && inv) {
    const m = (row.sku && inv[row.sku]) || (row.name && inv[row.name]);
    if (m && m.cost !== null && m.cost !== undefined) unitCost = m.cost;
  }
  let cogs, costEstimated = false;
  if (unitCost !== null && unitCost !== undefined) cogs = unitCost * row.qty;
  else { cogs = row.revenue * costRate; costEstimated = true; }

  let fees = row.fees, feesEstimated = false;
  if (fees === null || fees === undefined) { fees = row.revenue * feeRate; feesEstimated = true; }

  const shipping = row.shipping || 0;
  const profit = row.revenue - fees - shipping - cogs;
  return { cogs, fees, shipping, profit, unitCost: unitCost === null ? undefined : unitCost, costEstimated, feesEstimated };
}

/* ---------- bucketing ---------- */
function bucketKey(date, mode) {
  if (mode === "day") return fmtISO(date);
  if (mode === "week") {
    const d = startOfDay(date);
    const dow = (d.getDay() + 6) % 7;              // Monday = 0
    return fmtISO(addDays(d, -dow));
  }
  return date.getFullYear() + "-" + String(date.getMonth() + 1).padStart(2, "0") + "-01";
}

function pickBucketMode(spanDays) {
  if (spanDays <= 45) return "day";
  if (spanDays <= 400) return "week";
  return "month";
}

/* ---------- main ---------- */
function analyze(state) {
  const s = state.settings;
  const all = state.sales.rows;
  const inv = state.inventory;

  if (!all.length) return null;

  const dataMin = all[0].date;
  const dataMax = all[all.length - 1].date;
  const asOf = dataMax;

  /* --- period filter --- */
  let from = dataMin;
  if (state.filters.range !== "all") {
    const n = parseInt(state.filters.range, 10);
    from = addDays(asOf, -(n - 1));
    if (from < dataMin) from = dataMin;
  }
  const spanDays = Math.max(1, diffDays(from, asOf) + 1);
  const prevFrom = addDays(from, -spanDays);
  const prevTo = addDays(from, -1);

  const q = (state.filters.search || "").trim().toLowerCase();
  const chan = state.filters.channel || "__all";
  const matches = r =>
    (chan === "__all" || (r.channel || t("ui.other")) === chan) &&
    (!q || (r.key + " " + r.name).toLowerCase().indexOf(q) !== -1);

  const current = [], previous = [];
  for (const r of all) {
    if (!matches(r)) continue;
    if (r.date >= from && r.date <= asOf) current.push(r);
    else if (r.date >= prevFrom && r.date <= prevTo) previous.push(r);
  }

  /* --- totals --- */
  function totals(rows) {
    const acc = { revenue: 0, fees: 0, shipping: 0, cogs: 0, profit: 0, units: 0, rows: 0, orders: new Set() };
    for (const r of rows) {
      const e = rowEconomics(r, inv, s);
      acc.revenue += r.revenue;
      acc.fees += e.fees;
      acc.shipping += e.shipping;
      acc.cogs += e.cogs;
      acc.profit += e.profit;
      acc.units += r.qty;
      acc.rows += 1;
      if (r.order) acc.orders.add(r.order);
    }
    acc.orderCount = acc.orders.size || acc.rows;
    acc.margin = acc.revenue > 0 ? acc.profit / acc.revenue : null;
    acc.aov = acc.orderCount > 0 ? acc.revenue / acc.orderCount : null;
    delete acc.orders;
    return acc;
  }
  const cur = totals(current);
  const prev = previous.length ? totals(previous) : null;

  /* --- time buckets --- */
  const bucketMode = pickBucketMode(spanDays);
  const bucketMap = new Map();
  for (const r of current) {
    const k = bucketKey(r.date, bucketMode);
    let b = bucketMap.get(k);
    if (!b) {
      b = { key: k, date: new Date(+k.slice(0, 4), +k.slice(5, 7) - 1, +k.slice(8, 10)), inflow: 0, outflow: 0, revenue: 0, units: 0 };
      bucketMap.set(k, b);
    }
    const e = rowEconomics(r, inv, s);
    b.revenue += r.revenue;
    b.inflow += r.revenue - e.fees - e.shipping;    // net payout
    b.outflow += e.cogs;
    b.units += r.qty;
  }
  const buckets = Array.from(bucketMap.values()).sort((a, b) => a.date - b.date);
  // spread fixed costs across the buckets they actually cover
  const fixedPerDay = (s.fixedCosts || 0) / 30.44;
  const bucketDays = bucketMode === "day" ? 1 : bucketMode === "week" ? 7 : 30.44;
  for (const b of buckets) b.outflow += fixedPerDay * bucketDays;
  for (const b of buckets) b.net = b.inflow - b.outflow;

  /* --- per product --- */
  const skuMap = new Map();
  for (const r of current) {
    let p = skuMap.get(r.key);
    if (!p) {
      p = { key: r.key, sku: r.sku, name: r.name, units: 0, revenue: 0, profit: 0, cogs: 0, fees: 0, costEstimated: false, unitCosts: [] };
      skuMap.set(r.key, p);
    }
    const e = rowEconomics(r, inv, s);
    p.units += r.qty;
    p.revenue += r.revenue;
    p.profit += e.profit;
    p.cogs += e.cogs;
    p.fees += e.fees;
    if (e.costEstimated) p.costEstimated = true;
    if (e.unitCost !== undefined) p.unitCosts.push(e.unitCost);
  }

  /* --- velocity window (always anchored at asOf, independent of the period filter) --- */
  const velWindow = Math.max(1, s.velWindow);
  const velFrom = addDays(asOf, -(velWindow - 1));
  const velUnits = new Map();
  for (const r of all) {
    if (r.date < velFrom || r.date > asOf) continue;
    if (!matches(r)) continue;
    velUnits.set(r.key, (velUnits.get(r.key) || 0) + r.qty);
  }
  const velDays = Math.max(1, Math.min(velWindow, diffDays(dataMin, asOf) + 1));

  const hasStock = !!inv;
  const products = [];
  for (const p of skuMap.values()) {
    const m = inv ? (inv[p.key] || (p.sku && inv[p.sku]) || null) : null;
    const velocity = (velUnits.get(p.key) || 0) / velDays;
    const unitCost = p.unitCosts.length
      ? p.unitCosts.reduce((a, b) => a + b, 0) / p.unitCosts.length
      : (m && m.cost !== null && m.cost !== undefined ? m.cost : (p.units > 0 ? (p.cogs / p.units) : 0));
    const stock = m && m.stock !== null && m.stock !== undefined ? m.stock : null;
    const lead = m && m.lead !== null && m.lead !== undefined && m.lead > 0 ? m.lead : s.leadTime;
    const moq = m && m.moq !== null && m.moq !== undefined && m.moq > 0 ? m.moq : 1;

    const item = {
      key: p.key, sku: p.sku, name: p.name || p.key,
      units: p.units, revenue: p.revenue, profit: p.profit,
      margin: p.revenue > 0 ? p.profit / p.revenue : null,
      avgPrice: p.units > 0 ? p.revenue / p.units : 0,
      costEstimated: p.costEstimated,
      velocity, unitCost, stock, lead, moq,
      supplier: m ? m.supplier : null,
      stockValue: stock !== null ? stock * unitCost : null,
      cover: null, stockoutDate: null, orderByDate: null, orderQty: 0, orderCost: 0,
      status: "unknown"
    };

    if (stock === null) {
      item.status = velocity > 0 ? "unknown" : "idle";
    } else if (velocity <= 0) {
      item.status = "idle";
      item.cover = Infinity;
    } else {
      const cover = stock / velocity;
      item.cover = cover;
      item.stockoutDate = addDays(asOf, Math.floor(cover));
      const reorderPoint = velocity * (lead + s.safetyDays);
      const orderInDays = Math.max(0, Math.floor(cover - lead - s.safetyDays));
      item.orderByDate = addDays(asOf, orderInDays);

      const target = velocity * (lead + s.targetCover + s.safetyDays);
      let qty = Math.ceil(Math.max(0, target - stock));
      if (qty > 0 && moq > 1) qty = Math.ceil(qty / moq) * moq;
      if (qty > 0 && qty < moq) qty = moq;
      item.orderQty = qty;
      item.orderCost = qty * unitCost;

      if (stock <= 0) item.status = "critical";
      else if (stock <= reorderPoint) item.status = "serious";
      else if (cover <= lead + s.safetyDays + Math.max(7, s.targetCover * 0.3)) item.status = "warning";
      else item.status = "good";
    }
    products.push(item);
  }
  products.sort((a, b) => b.profit - a.profit);

  const stockValue = products.reduce((a, p) => a + (p.stockValue || 0), 0);
  const stockUnits = products.reduce((a, p) => a + (p.stock || 0), 0);
  const atRisk = products.filter(p => p.status === "critical" || p.status === "serious").length;

  /* --- restock plan --- */
  const severity = { critical: 0, serious: 1, warning: 2, good: 3, idle: 4, unknown: 5 };
  const plan = products
    .filter(p => p.orderQty > 0 && (p.status === "critical" || p.status === "serious" || p.status === "warning"))
    .sort((a, b) => {
      const d = severity[a.status] - severity[b.status];
      if (d !== 0) return d;
      return (a.orderByDate || 0) - (b.orderByDate || 0);
    });
  const planCost = plan.reduce((a, p) => a + p.orderCost, 0);

  /* --- channels --- */
  const chanMap = new Map();
  for (const r of current) {
    const k = r.channel || t("ui.other");
    const e = rowEconomics(r, inv, s);
    let c = chanMap.get(k);
    if (!c) { c = { key: k, revenue: 0, profit: 0, units: 0 }; chanMap.set(k, c); }
    c.revenue += r.revenue;
    c.profit += e.profit;
    c.units += r.qty;
  }
  const channels = Array.from(chanMap.values()).sort((a, b) => b.revenue - a.revenue);

  /* --- cash forecast --- */
  const forecast = buildForecast({
    products, asOf, settings: s, totals: cur, spanDays, hasStock
  });

  /* --- historical balance, back-cast so that "today" equals the stated opening balance --- */
  const histDays = Math.min(spanDays, 120);
  const histFrom = addDays(asOf, -(histDays - 1));
  const dailyNet = new Map();
  for (const r of current) {
    if (r.date < histFrom) continue;
    const e = rowEconomics(r, inv, s);
    const k = fmtISO(r.date);
    dailyNet.set(k, (dailyNet.get(k) || 0) + (r.revenue - e.fees - e.shipping - e.cogs));
  }
  const history = [];
  let bal = s.startCash;
  for (let i = 0; i < histDays; i++) {
    const d = addDays(asOf, -i);
    history.push({ date: d, balance: bal, actual: true });
    bal -= (dailyNet.get(fmtISO(d)) || 0) - fixedPerDay;
  }
  history.reverse();

  return {
    asOf, dataMin, dataMax, from, spanDays, bucketMode,
    totals: cur, prev,
    buckets, products, plan, planCost, channels,
    stockValue, stockUnits, atRisk,
    hasStock,
    history, forecast,
    flags: {
      costEstimated: products.filter(p => p.costEstimated).length,
      feesEstimated: !state.sales.sawFees,
      skipped: state.sales.skipped
    }
  };
}

/* ---------- forward projection ---------- */
function buildForecast(o) {
  const { products, asOf, settings, totals, spanDays, hasStock } = o;
  const horizon = settings.horizon;
  const fixedPerDay = (settings.fixedCosts || 0) / 30.44;
  const payoutRatio = totals.revenue > 0
    ? Math.max(0, (totals.revenue - totals.fees - totals.shipping) / totals.revenue)
    : 0.8;

  // per-product simulation state
  const sim = products
    .filter(p => p.velocity > 0)
    .map(p => ({
      key: p.key, name: p.name,
      velocity: p.velocity,
      price: p.avgPrice,
      stock: hasStock && p.stock !== null ? p.stock : Infinity,
      unitCost: p.unitCost,
      lead: Math.max(0, Math.round(p.lead)),
      moq: p.moq || 1,
      reorderPoint: p.velocity * (p.lead + settings.safetyDays),
      target: p.velocity * (p.lead + settings.targetCover + settings.safetyDays),
      inFlight: []                       // [{arriveDay, qty}]
    }));

  // fallback when nothing has a price/velocity: flat run-rate from history
  const dailyRunRate = spanDays > 0 ? totals.revenue / spanDays : 0;
  const simRevenue = sim.reduce((a, p) => a + p.velocity * p.price, 0);
  const useSim = simRevenue > 0;

  const days = [];
  let balance = settings.startCash;
  let lowest = { balance: balance, date: asOf };
  let zeroDate = null;
  const orders = [];

  for (let i = 1; i <= horizon; i++) {
    const date = addDays(asOf, i);
    let gross = 0, outflow = fixedPerDay, restock = 0;

    for (const p of sim) {
      // goods arriving today
      for (let k = p.inFlight.length - 1; k >= 0; k--) {
        if (p.inFlight[k].arriveDay === i) { p.stock += p.inFlight[k].qty; p.inFlight.splice(k, 1); }
      }
      // rolling replenishment: order again whenever the position falls to the
      // reorder point, so a long horizon shows repeat purchases, not just one
      if (p.stock !== Infinity) {
        const onOrder = p.inFlight.reduce((a, o) => a + o.qty, 0);
        if (p.stock + onOrder <= p.reorderPoint) {
          let qty = Math.ceil(Math.max(0, p.target - p.stock - onOrder));
          if (qty > 0 && p.moq > 1) qty = Math.ceil(qty / p.moq) * p.moq;
          if (qty > 0 && qty < p.moq) qty = p.moq;
          if (qty > 0) {
            const cost = qty * p.unitCost;
            restock += cost;
            p.inFlight.push({ arriveDay: i + p.lead, qty });
            orders.push({ day: i, date, key: p.key, name: p.name, qty, cost });
          }
        }
      }
      const sellable = Math.min(p.velocity, p.stock === Infinity ? p.velocity : Math.max(0, p.stock));
      gross += sellable * p.price;
      if (p.stock !== Infinity) p.stock = Math.max(0, p.stock - p.velocity);
    }

    if (!useSim) gross = dailyRunRate;
    const inflow = gross * payoutRatio;
    outflow += restock;
    balance += inflow - outflow;

    days.push({ date, balance, inflow, outflow, restock, gross, actual: false });
    if (balance < lowest.balance) lowest = { balance, date };
    if (balance < 0 && !zeroDate) zeroDate = date;
  }

  return {
    days, orders, lowest, zeroDate,
    end: days.length ? days[days.length - 1].balance : settings.startCash,
    horizon,
    runwayDays: zeroDate ? diffDays(asOf, zeroDate) : null,
    payoutRatio
  };
}

/* ----- src/50-charts.js ----- */
/* ============================================================
   Charts — hand-rolled inline SVG. No chart library, no CDN.
   Mark specs follow the house rules: thin marks, 4px rounded
   data-ends, 2px surface gaps, hairline solid grid, legend for
   every multi-series chart, and a table twin for each one.
   ============================================================ */

const SVG_NS = "http://www.w3.org/2000/svg";

function el(name, attrs, parent) {
  const n = document.createElementNS(SVG_NS, name);
  if (attrs) for (const k in attrs) if (attrs[k] !== null && attrs[k] !== undefined) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}

function esc(s) {
  return String(s === null || s === undefined ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function niceTicks(min, max, count) {
  if (min === max) { max = min + 1; }
  const span = max - min;
  const raw = span / (count || 4);
  const mag = Math.pow(10, Math.floor(Math.log10(Math.abs(raw) || 1)));
  const norm = raw / mag;
  const step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 2.5 ? 2.5 : norm <= 5 ? 5 : 10) * mag;
  const lo = Math.floor(min / step) * step;
  const hi = Math.ceil(max / step) * step;
  const out = [];
  for (let v = lo; v <= hi + step * 0.001; v += step) out.push(Math.abs(v) < step * 1e-9 ? 0 : v);
  return out;
}

/* One formatting decision per axis, applied to every tick on it.
   German compact notation only abbreviates from a million upwards, so below
   that grouped standard notation is both shorter to read and consistent. */
function makeTickFormat(maxAbs) {
  const compact = maxAbs >= 1e6;
  return v => fmtCurrency(v, { compact: compact, force: compact, decimals: 0 });
}

/* Rounded rect with 4px rounded data-end, square at the baseline. */
function barPath(x, y, w, h, r, dir) {
  const rr = Math.max(0, Math.min(r, w / 2, h));
  if (h <= 0.5) return "";
  if (dir === "up") {
    return `M${x},${y + h} L${x},${y + rr} Q${x},${y} ${x + rr},${y} L${x + w - rr},${y} Q${x + w},${y} ${x + w},${y + rr} L${x + w},${y + h} Z`;
  }
  // horizontal, rounded at the right end
  return `M${x},${y} L${x + w - rr},${y} Q${x + w},${y} ${x + w},${y + rr} L${x + w},${y + h - rr} Q${x + w},${y + h} ${x + w - rr},${y + h} L${x},${y + h} Z`;
}

function makeTip(wrap) {
  let tip = wrap.querySelector(".tip");
  if (!tip) { tip = document.createElement("div"); tip.className = "tip"; wrap.appendChild(tip); }
  return tip;
}

function showTip(tip, wrap, x, y, html) {
  tip.innerHTML = html;
  tip.classList.add("on");
  const w = wrap.clientWidth;
  const tw = tip.offsetWidth;
  const left = Math.max(tw / 2 + 2, Math.min(w - tw / 2 - 2, x));
  tip.style.left = left + "px";
  tip.style.top = Math.max(tip.offsetHeight + 4, y - 10) + "px";
}

function hideTip(tip) { tip.classList.remove("on"); }

function legendHTML(items) {
  return items.map(it =>
    `<span class="item"><span class="sw${it.line ? " line" : ""}" style="background:${it.color}${it.dashed ? ";background:repeating-linear-gradient(90deg," + it.color + " 0 4px,transparent 4px 7px)" : ""}"></span>${esc(it.label)}</span>`
  ).join("");
}

function emptyState(wrap) {
  wrap.innerHTML = `<div class="empty">${esc(t("chart.noData"))}</div>`;
}

/* ============================================================
   1. Money in / money out — grouped columns, two series
   ============================================================ */
function renderFlowChart(wrap, model) {
  wrap.innerHTML = "";
  const data = model.buckets;
  if (!data.length) { emptyState(wrap); return; }

  const W = Math.max(320, wrap.clientWidth || 520);
  const H = 250;
  const m = { t: 12, r: 10, b: 30, l: 66 };
  const pw = W - m.l - m.r, ph = H - m.t - m.b;

  const maxV = Math.max(1, ...data.map(d => Math.max(d.inflow, d.outflow)));
  const ticks = niceTicks(0, maxV, 4);
  const yMax = ticks[ticks.length - 1];
  const y = v => m.t + ph - (v / yMax) * ph;

  const svg = el("svg", { class: "chart", viewBox: `0 0 ${W} ${H}`, role: "img" }, wrap);
  svg.setAttribute("aria-label", t("chart.flowTitle"));

  const tickFmt = makeTickFormat(yMax);
  for (const tk of ticks) {
    el("line", { class: "grid-line", x1: m.l, x2: m.l + pw, y1: y(tk), y2: y(tk) }, svg);
    el("text", { class: "axis-txt", x: m.l - 8, y: y(tk) + 4, "text-anchor": "end" }, svg).textContent = tickFmt(tk);
  }
  el("line", { class: "axis-line", x1: m.l, x2: m.l + pw, y1: y(0), y2: y(0) }, svg);

  const band = pw / data.length;
  const barW = Math.max(2, Math.min(11, band / 2 - 3));
  const gap = 2;                                     // surface gap between the pair

  data.forEach((d, i) => {
    const cx = m.l + band * i + band / 2;
    const xIn = cx - barW - gap / 2;
    const xOut = cx + gap / 2;
    const hIn = Math.max(0, y(0) - y(d.inflow));
    const hOut = Math.max(0, y(0) - y(d.outflow));
    el("path", { d: barPath(xIn, y(d.inflow), barW, hIn, 4, "up"), fill: "var(--s1)" }, svg);
    el("path", { d: barPath(xOut, y(d.outflow), barW, hOut, 4, "up"), fill: "var(--s2)" }, svg);
  });

  // x labels — thinned out, and the final label is dropped when it would
  // land on top of the previous one
  const every = Math.max(1, Math.ceil(data.length / Math.max(2, Math.floor(pw / 62))));
  const lastShown = Math.floor((data.length - 1) / every) * every;
  const showLast = data.length - 1 - lastShown >= Math.max(1, Math.round(every * 0.6));
  data.forEach((d, i) => {
    if (i % every !== 0 && !(showLast && i === data.length - 1)) return;
    el("text", { class: "axis-txt", x: m.l + band * i + band / 2, y: H - 10, "text-anchor": "middle" }, svg)
      .textContent = model.bucketMode === "month"
        ? new Intl.DateTimeFormat(localeTag(), { month: "short", year: "2-digit" }).format(d.date)
        : fmtDate(d.date);
  });

  // hover layer
  const tip = makeTip(wrap);
  data.forEach((d, i) => {
    const hit = el("rect", { class: "hit", x: m.l + band * i, y: m.t, width: band, height: ph }, svg);
    const html =
      `<div class="t-head">${esc(fmtDate(d.date, "long"))}</div>` +
      `<div class="t-row"><span class="sw" style="background:var(--s1)"></span><span class="k">${esc(t("chart.inflow"))}</span><span class="v">${esc(fmtCurrency(d.inflow))}</span></div>` +
      `<div class="t-row"><span class="sw" style="background:var(--s2)"></span><span class="k">${esc(t("chart.outflow"))}</span><span class="v">${esc(fmtCurrency(d.outflow))}</span></div>` +
      `<div class="t-sep"></div>` +
      `<div class="t-row"><span class="k">${esc(t("chart.balance"))}</span><span class="v">${esc(fmtCurrency(d.net))}</span></div>`;
    const move = () => showTip(tip, wrap, m.l + band * i + band / 2, m.t + 20, html);
    hit.addEventListener("mouseenter", move);
    hit.addEventListener("mousemove", move);
    hit.addEventListener("mouseleave", () => hideTip(tip));
    hit.setAttribute("tabindex", "0");
    hit.addEventListener("focus", move);
    hit.addEventListener("blur", () => hideTip(tip));
  });

  document.getElementById("flow-legend").innerHTML = legendHTML([
    { color: "var(--s1)", label: t("chart.inflow") },
    { color: "var(--s2)", label: t("chart.outflow") }
  ]);
}

function flowTableHTML(model) {
  const head = `<tr><th>${esc(t("chart.bucket" + model.bucketMode.charAt(0).toUpperCase() + model.bucketMode.slice(1)))}</th>` +
    `<th class="num">${esc(t("chart.inflow"))}</th><th class="num">${esc(t("chart.outflow"))}</th><th class="num">${esc(t("chart.balance"))}</th></tr>`;
  const body = model.buckets.map(b =>
    `<tr><td>${esc(fmtDate(b.date, "long"))}</td><td class="num">${esc(fmtCurrency(b.inflow))}</td>` +
    `<td class="num">${esc(fmtCurrency(b.outflow))}</td><td class="num">${esc(fmtCurrency(b.net))}</td></tr>`
  ).join("");
  return `<div class="table-scroll"><table class="data"><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
}

/* ============================================================
   2. Balance forecast — line, actual + projection
   ============================================================ */
function renderCashChart(wrap, model) {
  wrap.innerHTML = "";
  const hist = model.history;
  const fc = model.forecast.days;
  const all = hist.concat(fc);
  if (all.length < 2) { emptyState(wrap); return; }

  const W = Math.max(320, wrap.clientWidth || 520);
  const H = 250;
  const m = { t: 14, r: 14, b: 30, l: 66 };
  const pw = W - m.l - m.r, ph = H - m.t - m.b;

  const vals = all.map(d => d.balance);
  const lo = Math.min(0, ...vals), hi = Math.max(...vals);
  const ticks = niceTicks(lo, hi, 4);
  const yMin = ticks[0], yMax = ticks[ticks.length - 1];
  const y = v => m.t + ph - ((v - yMin) / (yMax - yMin || 1)) * ph;
  const x = i => m.l + (i / (all.length - 1)) * pw;

  const svg = el("svg", { class: "chart", viewBox: `0 0 ${W} ${H}`, role: "img" }, wrap);
  svg.setAttribute("aria-label", t("chart.cashTitle"));

  const tickFmt = makeTickFormat(Math.max(Math.abs(yMin), Math.abs(yMax)));
  for (const tk of ticks) {
    el("line", { class: "grid-line", x1: m.l, x2: m.l + pw, y1: y(tk), y2: y(tk) }, svg);
    el("text", { class: "axis-txt", x: m.l - 8, y: y(tk) + 4, "text-anchor": "end" }, svg).textContent = tickFmt(tk);
  }
  if (yMin < 0) el("line", { class: "axis-line", x1: m.l, x2: m.l + pw, y1: y(0), y2: y(0) }, svg);

  const path = pts => pts.map((p, i) => (i ? "L" : "M") + x(p.i) + "," + y(p.v)).join(" ");
  const histPts = hist.map((d, i) => ({ i, v: d.balance }));
  const fcPts = fc.map((d, i) => ({ i: hist.length + i, v: d.balance }));
  if (histPts.length) fcPts.unshift(histPts[histPts.length - 1]);

  // area wash under the actual line
  if (histPts.length > 1) {
    const area = path(histPts) + ` L${x(histPts[histPts.length - 1].i)},${y(Math.max(yMin, 0))} L${x(0)},${y(Math.max(yMin, 0))} Z`;
    el("path", { d: area, fill: "var(--s1)", "fill-opacity": ".10" }, svg);
    el("path", { d: path(histPts), fill: "none", stroke: "var(--s1)", "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }, svg);
  }
  el("path", { d: path(fcPts), fill: "none", stroke: "var(--s1)", "stroke-width": 2, "stroke-dasharray": "5 4", "stroke-linecap": "round" }, svg);

  // today divider
  const todayX = x(Math.max(0, hist.length - 1));
  el("line", { class: "axis-line", x1: todayX, x2: todayX, y1: m.t, y2: m.t + ph }, svg);
  el("text", { class: "axis-txt", x: todayX + 5, y: m.t + 10 }, svg).textContent = t("chart.today");

  // restock markers on the forecast
  for (const o of model.forecast.orders) {
    const idx = hist.length + o.day - 1;
    if (idx >= all.length) continue;
    const px = x(idx), py = y(all[idx].balance);
    el("circle", { cx: px, cy: py, r: 5.5, fill: "var(--s2)", stroke: "var(--surface)", "stroke-width": 2 }, svg);
  }

  // end label — one direct label, on the last point
  const last = all[all.length - 1];
  const lx = x(all.length - 1), ly = y(last.balance);
  el("circle", { cx: lx, cy: ly, r: 4.5, fill: "var(--s1)", stroke: "var(--surface)", "stroke-width": 2 }, svg);
  const lab = el("text", { class: "dir-label", x: lx - 6, y: ly - 10, "text-anchor": "end" }, svg);
  lab.textContent = fmtCurrency(last.balance, { compact: true, decimals: 0 });

  // crosshair + tooltip
  const tip = makeTip(wrap);
  const cross = el("line", { class: "axis-line", x1: 0, x2: 0, y1: m.t, y2: m.t + ph, opacity: 0 }, svg);
  const dot = el("circle", { r: 4.5, fill: "var(--s1)", stroke: "var(--surface)", "stroke-width": 2, opacity: 0 }, svg);
  const surface = el("rect", { class: "hit", x: m.l, y: m.t, width: pw, height: ph }, svg);

  const ordersByDay = {};
  for (const o of model.forecast.orders) ordersByDay[o.day] = (ordersByDay[o.day] || []).concat(o);

  function at(clientX) {
    const box = svg.getBoundingClientRect();
    const px = (clientX - box.left) * (W / box.width);
    let idx = Math.round(((px - m.l) / pw) * (all.length - 1));
    idx = Math.max(0, Math.min(all.length - 1, idx));
    const d = all[idx];
    cross.setAttribute("x1", x(idx)); cross.setAttribute("x2", x(idx)); cross.setAttribute("opacity", 1);
    dot.setAttribute("cx", x(idx)); dot.setAttribute("cy", y(d.balance)); dot.setAttribute("opacity", 1);
    let html = `<div class="t-head">${esc(fmtDate(d.date, "long"))}</div>` +
      `<div class="t-row"><span class="sw" style="background:var(--s1)"></span><span class="k">${esc(t("chart.balance"))}</span><span class="v">${esc(fmtCurrency(d.balance))}</span></div>` +
      `<div class="t-row"><span class="k">${esc(d.actual ? t("chart.actual") : t("chart.forecast"))}</span><span class="v"></span></div>`;
    if (!d.actual) {
      const day = idx - hist.length + 1;
      const os = ordersByDay[day];
      if (os) {
        html += `<div class="t-sep"></div>`;
        for (const o of os) {
          html += `<div class="t-row"><span class="sw" style="background:var(--s2)"></span><span class="k">${esc(o.name)}</span><span class="v">${esc(fmtCurrency(o.cost))}</span></div>`;
        }
      }
    }
    showTip(tip, wrap, x(idx), y(d.balance), html);
  }
  surface.addEventListener("mousemove", e => at(e.clientX));
  surface.addEventListener("mouseleave", () => {
    hideTip(tip); cross.setAttribute("opacity", 0); dot.setAttribute("opacity", 0);
  });

  document.getElementById("cash-legend").innerHTML = legendHTML([
    { color: "var(--s1)", label: t("chart.actual"), line: true },
    { color: "var(--s1)", label: t("chart.forecast"), line: true, dashed: true },
    { color: "var(--s2)", label: t("chart.restockDue") }
  ]);
}

function cashTableHTML(model) {
  const rows = model.forecast.days.filter((d, i) => i % 7 === 0 || i === model.forecast.days.length - 1);
  const head = `<tr><th>${esc(t("plan.h.orderBy"))}</th><th class="num">${esc(t("chart.inflow"))}</th>` +
    `<th class="num">${esc(t("chart.outflow"))}</th><th class="num">${esc(t("chart.balance"))}</th></tr>`;
  const body = rows.map(d =>
    `<tr><td>${esc(fmtDate(d.date, "long"))}</td><td class="num">${esc(fmtCurrency(d.inflow))}</td>` +
    `<td class="num">${esc(fmtCurrency(d.outflow))}</td><td class="num">${esc(fmtCurrency(d.balance))}</td></tr>`
  ).join("");
  return `<div class="table-scroll"><table class="data"><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
}

/* ============================================================
   3 & 4. Horizontal bars — one series, direct-labelled
   ============================================================ */
function renderBarChart(wrap, items, opts) {
  wrap.innerHTML = "";
  if (!items.length) { emptyState(wrap); return; }

  const W = Math.max(320, wrap.clientWidth || 520);
  const rowH = 30;
  // the right margin reserves room for the direct value labels, so no
  // label is ever placed inside a bar or clipped at the edge
  const m = { t: 6, r: 74, b: 8, l: Math.min(150, Math.max(96, Math.round(W * 0.32))) };
  const H = m.t + m.b + items.length * rowH;
  const pw = W - m.l - m.r;

  const maxV = Math.max(1, ...items.map(d => Math.abs(d.value)));
  const minV = Math.min(0, ...items.map(d => d.value));
  const span = maxV - Math.min(0, minV);
  const zeroX = m.l + (Math.min(0, minV) < 0 ? (-minV / span) * pw : 0);
  const scale = v => (Math.abs(v) / span) * pw;

  const svg = el("svg", { class: "chart", viewBox: `0 0 ${W} ${H}`, role: "img" }, wrap);
  svg.setAttribute("aria-label", opts.title || "");

  const tip = makeTip(wrap);
  const barH = Math.min(14, rowH - 12);

  items.forEach((d, i) => {
    const yTop = m.t + i * rowH + (rowH - barH) / 2;
    const w = Math.max(1, scale(d.value));
    const x0 = d.value >= 0 ? zeroX : zeroX - w;

    el("path", { d: barPath(x0, yTop, w, barH, 4, "right"), fill: opts.color || "var(--s1)" }, svg);

    // category label, left of the axis, truncated with an ellipsis rather than clipped
    const maxChars = Math.max(8, Math.floor((m.l - 14) / 6.6));
    const label = d.label.length > maxChars ? d.label.slice(0, maxChars - 1) + "…" : d.label;
    const tx = el("text", { class: "axis-txt", x: m.l - 10, y: yTop + barH / 2 + 4, "text-anchor": "end" }, svg);
    tx.textContent = label;

    // direct value label at the bar tip, always outside the mark
    const vl = el("text", { class: "dir-label", y: yTop + barH / 2 + 4 }, svg);
    vl.textContent = opts.format(d.value);
    vl.setAttribute("x", d.value >= 0 ? x0 + w + 7 : x0 - 7);
    vl.setAttribute("text-anchor", d.value >= 0 ? "start" : "end");

    const hit = el("rect", { class: "hit", x: m.l, y: m.t + i * rowH, width: pw, height: rowH }, svg);
    const html = `<div class="t-head">${esc(d.label)}</div>` +
      (d.detail || []).map(row =>
        `<div class="t-row"><span class="k">${esc(row[0])}</span><span class="v">${esc(row[1])}</span></div>`).join("");
    const move = () => showTip(tip, wrap, Math.min(W - 40, x0 + w), m.t + i * rowH + 6, html);
    hit.addEventListener("mouseenter", move);
    hit.addEventListener("mousemove", move);
    hit.addEventListener("mouseleave", () => hideTip(tip));
  });

  if (minV < 0) el("line", { class: "axis-line", x1: zeroX, x2: zeroX, y1: m.t, y2: H - m.b }, svg);
}

function simpleTableHTML(cols, rows) {
  const head = "<tr>" + cols.map(c => `<th${c.num ? ' class="num"' : ""}>${esc(c.label)}</th>`).join("") + "</tr>";
  const body = rows.map(r => "<tr>" + r.map((v, i) =>
    `<td${cols[i].num ? ' class="num"' : ""}>${esc(v)}</td>`).join("") + "</tr>").join("");
  return `<div class="table-scroll"><table class="data"><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
}

/* ----- src/60-app.js ----- */
/* ============================================================
   Application shell — state, persistence, language, rendering.
   ============================================================ */

const LS = {
  settings: "flowstock.settings.v1",
  lang: "flowstock.lang",
  theme: "flowstock.theme",
  data: "flowstock.data.v1"
};

const DEFAULT_SETTINGS = {
  currency: "EUR",
  startCash: 5000,
  fixedCosts: 600,
  horizon: 90,
  leadTime: 21,
  targetCover: 45,
  safetyDays: 7,
  velWindow: 30,
  defaultCost: 40,
  defaultFee: 12,
  remember: false
};

const STATE = {
  settings: Object.assign({}, DEFAULT_SETTINGS),
  salesRaw: null, salesMap: null,
  invRaw: null, invMap: null,
  sales: null, inventory: null,
  filters: { range: "all", channel: "__all", search: "" },
  model: null,
  views: { flow: "chart", cash: "chart", sku: "chart", chan: "chart" },
  sort: { inv: { key: "profit", dir: -1 }, plan: null },
  fileNames: { sales: null, inv: null }
};

const $ = sel => document.querySelector(sel);
const $$ = sel => Array.prototype.slice.call(document.querySelectorAll(sel));

/* ============================================================
   Language & theme
   ============================================================ */
function applyI18n() {
  document.documentElement.lang = LANG;
  const vars = { days: STATE.settings.horizon, bucket: t("chart.bucketWeek"), cash: "", n: 0, total: 0, pct: "", value: "" };
  $$("[data-i18n]").forEach(node => {
    const key = node.getAttribute("data-i18n");
    node.textContent = t(key, vars);
  });
  $("#lang-de").setAttribute("aria-pressed", String(LANG === "de"));
  $("#lang-en").setAttribute("aria-pressed", String(LANG === "en"));
  document.title = "FlowStock — " + t("app.tagline");
  $("#about-body").innerHTML = I18N_PROSE[LANG].about.replace("{version}", APP_VERSION);
  $("#help-body").innerHTML = I18N_PROSE[LANG].help;
  rebuildChannelFilter();
}

function setLang(lang) {
  LANG = (lang === "en" || lang === "de") ? lang : "de";
  try { localStorage.setItem(LS.lang, LANG); } catch (e) {}
  applyI18n();
  if (STATE.model) render();
}

function setTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  $("#ic-sun").hidden = theme === "dark";
  $("#ic-moon").hidden = theme !== "dark";
  try { localStorage.setItem(LS.theme, theme); } catch (e) {}
  if (STATE.model) renderCharts();
}

/* ============================================================
   Persistence
   ============================================================ */
function loadSettings() {
  try {
    const raw = localStorage.getItem(LS.settings);
    if (raw) Object.assign(STATE.settings, JSON.parse(raw));
  } catch (e) {}
}

function saveSettings() {
  try { localStorage.setItem(LS.settings, JSON.stringify(STATE.settings)); } catch (e) {}
}

function persistData() {
  if (!STATE.settings.remember || !STATE.salesRaw) { return; }
  try {
    localStorage.setItem(LS.data, JSON.stringify({
      salesRaw: STATE.salesRaw, salesMap: STATE.salesMap,
      invRaw: STATE.invRaw, invMap: STATE.invMap,
      fileNames: STATE.fileNames
    }));
  } catch (e) {
    STATE.settings.remember = false;
    saveSettings();
  }
}

function restoreData() {
  try {
    const raw = localStorage.getItem(LS.data);
    if (!raw) return false;
    const d = JSON.parse(raw);
    if (!d || !d.salesRaw) return false;
    STATE.salesRaw = d.salesRaw; STATE.salesMap = d.salesMap;
    STATE.invRaw = d.invRaw || null; STATE.invMap = d.invMap || null;
    STATE.fileNames = d.fileNames || { sales: null, inv: null };
    return buildAndRender();
  } catch (e) { return false; }
}

function clearStoredData() {
  try {
    localStorage.removeItem(LS.data);
    localStorage.removeItem(LS.settings);
  } catch (e) {}
  STATE.settings.remember = false;
}

/* ============================================================
   File intake
   ============================================================ */
function showLandingError(msg) {
  const box = $("#landing-error");
  if (!msg) { box.hidden = true; return; }
  $("#landing-error-text").textContent = msg;
  box.hidden = false;
}

async function handleFile(file, kind) {
  showLandingError("");
  try {
    const text = await readFileText(file);
    const parsed = parseCSV(text);
    if (!parsed.rows.length) throw new Error(t("err.empty"));
    if (kind === "sales") {
      STATE.salesRaw = parsed;
      STATE.salesMap = detectColumns(parsed.headers, FIELD_ALIASES);
      STATE.fileNames.sales = file.name;
    } else {
      STATE.invRaw = parsed;
      STATE.invMap = detectColumns(parsed.headers, INV_ALIASES);
      STATE.fileNames.inv = file.name;
    }
    updateSlots();
    if (STATE.salesRaw) openMapping();
  } catch (err) {
    showLandingError(t("err.parse", { msg: err.message || String(err) }));
  }
}

function updateSlots() {
  const s = $("#slot-sales"), i = $("#slot-inv");
  s.classList.toggle("is-set", !!STATE.salesRaw);
  i.classList.toggle("is-set", !!STATE.invRaw);
  s.querySelector(".nm").textContent = STATE.fileNames.sales
    ? STATE.fileNames.sales + " · " + STATE.salesRaw.rows.length
    : t("landing.slotSalesEmpty");
  i.querySelector(".nm").textContent = STATE.fileNames.inv
    ? STATE.fileNames.inv + " · " + STATE.invRaw.rows.length
    : t("landing.slotInvEmpty");
  s.querySelector("[data-clear]").hidden = !STATE.salesRaw;
  i.querySelector("[data-clear]").hidden = !STATE.invRaw;
}

/* ============================================================
   Column mapping dialog
   ============================================================ */
const SALES_FIELDS = ["date", "sku", "product", "qty", "revenue", "price", "cost", "fees", "shipping", "shipRev", "discount", "channel", "order"];
const INV_FIELDS = ["sku", "product", "stock", "cost", "lead", "moq", "supplier"];

function mapRow(field, headers, selected, required) {
  const opts = ['<option value="">— ' + esc(t("ui.notSet")) + " —</option>"]
    .concat(headers.map(h => `<option value="${esc(h)}"${h === selected ? " selected" : ""}>${esc(h)}</option>`))
    .join("");
  return `<div class="map-row"><span class="lab">${esc(t("map.f." + field))}</span>` +
    `<select data-map-field="${esc(field)}">${opts}</select></div>`;
}

function openMapping() {
  const sm = STATE.salesMap || {};
  $("#map-sales").innerHTML = SALES_FIELDS.map(f => mapRow(f, STATE.salesRaw.headers, sm[f])).join("");
  const hasInv = !!STATE.invRaw;
  $("#map-inv-block").hidden = !hasInv;
  if (hasInv) {
    const im = STATE.invMap || {};
    $("#map-inv").innerHTML = INV_FIELDS.map(f => mapRow(f, STATE.invRaw.headers, im[f])).join("");
  }
  $("#map-error").hidden = true;
  $("#dlg-map").showModal();
}

function readMapping() {
  const sales = {}, inv = {};
  $$("#map-sales [data-map-field]").forEach(sel => { if (sel.value) sales[sel.getAttribute("data-map-field")] = sel.value; });
  $$("#map-inv [data-map-field]").forEach(sel => { if (sel.value) inv[sel.getAttribute("data-map-field")] = sel.value; });
  return { sales, inv };
}

/* ============================================================
   Build model + render
   ============================================================ */
function buildAndRender() {
  const built = buildSalesRows(STATE.salesRaw, STATE.salesMap, STATE.settings);
  if (!built.rows.length) {
    showLandingError(t("err.noRows"));
    return false;
  }
  STATE.sales = built;
  STATE.inventory = STATE.invRaw && STATE.invMap ? buildInventory(STATE.invRaw, STATE.invMap) : null;
  STATE.filters.channel = "__all";
  $("#view-landing").hidden = true;
  $("#view-dash").hidden = false;
  $("#btn-settings").hidden = false;
  $("#btn-reset").hidden = false;
  rebuildChannelFilter();
  render();
  persistData();
  window.scrollTo(0, 0);
  return true;
}

function rebuildChannelFilter() {
  const sel = $("#f-channel");
  if (!sel) return;
  const chans = new Set();
  if (STATE.sales) for (const r of STATE.sales.rows) chans.add(r.channel || t("ui.other"));
  const list = Array.from(chans).sort();
  const cur = STATE.filters.channel;
  sel.innerHTML = `<option value="__all">${esc(t("ui.all"))}</option>` +
    list.map(c => `<option value="${esc(c)}"${c === cur ? " selected" : ""}>${esc(c)}</option>`).join("");
  sel.disabled = list.length < 2;
}

function render() {
  const model = analyze(STATE);
  STATE.model = model;
  if (!model) return;
  renderWarnings(model);
  renderKPIs(model);
  renderCharts();
  renderPlan(model);
  renderInventory(model);
}

function renderWarnings(model) {
  const msgs = [];
  if (!model.hasStock) msgs.push(t("warn.noStock"));
  if (model.flags.costEstimated > 0) msgs.push(t("warn.noCost", { n: model.flags.costEstimated, pct: STATE.settings.defaultCost + " %" }));
  if (model.flags.feesEstimated) msgs.push(t("warn.noFees", { pct: STATE.settings.defaultFee + " %" }));
  if (model.flags.skipped > 0) msgs.push(t("warn.skipped", { n: model.flags.skipped }));
  const box = $("#dash-warn");
  if (!msgs.length) { box.hidden = true; return; }
  $("#dash-warn-text").textContent = msgs.join(" ");
  box.hidden = false;
}

function delta(node, cur, prev, invert) {
  if (prev === null || prev === undefined || !isFinite(prev) || prev === 0) {
    node.className = "delta";
    node.textContent = t("kpi.noPrev");
    return;
  }
  const change = (cur - prev) / Math.abs(prev);
  const good = invert ? change < 0 : change > 0;
  node.className = "delta " + (Math.abs(change) < 0.005 ? "" : good ? "up" : "down");
  node.textContent = (change > 0 ? "▲ " : change < 0 ? "▼ " : "") + fmtSigned(change) + " " + t("kpi.vsPrev");
}

function renderKPIs(m) {
  const s = STATE.settings;
  const f = m.forecast;

  $("#hero-val").textContent = fmtCurrency(f.end, { decimals: 0 });
  $("[data-i18n='kpi.heroLabel']").textContent = t("kpi.heroLabel", { days: s.horizon });
  $("#hero-sub").textContent = t("kpi.heroSub", { cash: fmtCurrency(s.startCash, { decimals: 0 }) });
  $("#hero-today").textContent = fmtCurrency(s.startCash, { decimals: 0 });
  $("#hero-low").textContent = fmtCurrency(f.lowest.balance, { decimals: 0 });
  $("#hero-runway").textContent = f.runwayDays === null
    ? t("kpi.runwayOk", { days: s.horizon })
    : f.runwayDays + " " + t("ui.days");

  $("#k-rev").textContent = fmtCurrency(m.totals.revenue, { decimals: 0 });
  delta($("#k-rev-d"), m.totals.revenue, m.prev ? m.prev.revenue : null);

  $("#k-profit").textContent = fmtCurrency(m.totals.profit, { decimals: 0 });
  delta($("#k-profit-d"), m.totals.profit, m.prev ? m.prev.profit : null);

  $("#k-margin").textContent = m.totals.margin === null ? t("ui.none") : fmtPct(m.totals.margin, 1);
  $("#k-margin-d").className = "delta";
  $("#k-margin-d").textContent = t("kpi.ofRevenue", { pct: fmtCurrency(m.totals.profit, { compact: true, decimals: 0 }) });

  $("#k-orders").textContent = fmtNum(m.totals.orderCount);
  $("#k-orders-d").className = "delta";
  $("#k-orders-d").textContent = m.totals.aov === null ? "" : t("kpi.avgOrder", { value: fmtCurrency(m.totals.aov) });

  $("#k-stock").textContent = m.hasStock ? fmtCurrency(m.stockValue, { decimals: 0 }) : t("ui.none");
  $("#k-stock-d").className = "delta";
  $("#k-stock-d").textContent = m.hasStock ? t("kpi.stockUnits", { n: fmtNum(m.stockUnits) }) : "";

  $("#k-risk").textContent = m.hasStock ? fmtNum(m.atRisk) : t("ui.none");
  $("#k-risk-d").className = "delta" + (m.hasStock && m.atRisk > 0 ? " down" : "");
  $("#k-risk-d").textContent = m.hasStock ? t("kpi.skuCount", { n: m.atRisk, total: m.products.length }) : "";

  $("[data-i18n='chart.flowSub']").textContent = t("chart.flowSub", {
    bucket: t("chart.bucket" + m.bucketMode.charAt(0).toUpperCase() + m.bucketMode.slice(1))
  });
}

function renderCharts() {
  const m = STATE.model;
  if (!m) return;

  if (STATE.views.flow === "chart") renderFlowChart($("#flow-chart"), m);
  $("#flow-table").innerHTML = flowTableHTML(m);

  if (STATE.views.cash === "chart") renderCashChart($("#cash-chart"), m);
  $("#cash-table").innerHTML = cashTableHTML(m);

  const top = m.products.filter(p => p.profit !== 0).slice(0, 10);
  if (STATE.views.sku === "chart") {
    renderBarChart($("#sku-chart"), top.map(p => ({
      label: p.name,
      value: p.profit,
      detail: [
        [t("inv.h.revenue"), fmtCurrency(p.revenue)],
        [t("inv.h.profit"), fmtCurrency(p.profit)],
        [t("inv.h.marginPct"), p.margin === null ? t("ui.none") : fmtPct(p.margin, 0)],
        [t("inv.h.units"), fmtNum(p.units) + " " + t("ui.units")]
      ]
    })), { color: "var(--s1)", title: t("chart.skuTitle"), format: v => fmtCurrency(v, { compact: true, decimals: 0 }) });
  }
  $("#sku-table").innerHTML = simpleTableHTML(
    [{ label: t("inv.h.sku") }, { label: t("inv.h.revenue"), num: true }, { label: t("inv.h.profit"), num: true }, { label: t("inv.h.marginPct"), num: true }],
    top.map(p => [p.name, fmtCurrency(p.revenue), fmtCurrency(p.profit), p.margin === null ? t("ui.none") : fmtPct(p.margin, 0)])
  );

  const chans = m.channels.slice(0, 8);
  if (STATE.views.chan === "chart") {
    renderBarChart($("#chan-chart"), chans.map(c => ({
      label: c.key,
      value: c.revenue,
      detail: [
        [t("inv.h.revenue"), fmtCurrency(c.revenue)],
        [t("inv.h.profit"), fmtCurrency(c.profit)],
        [t("inv.h.units"), fmtNum(c.units) + " " + t("ui.units")]
      ]
    })), { color: "var(--s1)", title: t("chart.chanTitle"), format: v => fmtCurrency(v, { compact: true, decimals: 0 }) });
  }
  $("#chan-table").innerHTML = simpleTableHTML(
    [{ label: t("filter.channel") }, { label: t("inv.h.revenue"), num: true }, { label: t("inv.h.profit"), num: true }],
    chans.map(c => [c.key, fmtCurrency(c.revenue), fmtCurrency(c.profit)])
  );
}

/* ---------- status pill ---------- */
const STATUS_ICON = { critical: "✕", serious: "▲", warning: "●", good: "✓", idle: "–", unknown: "?" };
function statusPill(status) {
  return `<span class="pill ${esc(status)}" title="${esc(t("status." + status + "Desc") || "")}">` +
    `<span class="ic" aria-hidden="true">${STATUS_ICON[status] || "?"}</span>${esc(t("status." + status))}</span>`;
}

function renderPlan(m) {
  const tbl = $("#plan-table");
  const empty = $("#plan-empty");
  if (!m.hasStock || !m.plan.length) {
    tbl.innerHTML = "";
    empty.hidden = false;
    empty.textContent = m.hasStock ? t("plan.empty") : t("inv.noStock");
    return;
  }
  empty.hidden = true;
  const head = `<thead><tr>
    <th>${esc(t("plan.h.status"))}</th>
    <th>${esc(t("plan.h.sku"))}</th>
    <th>${esc(t("plan.h.orderBy"))}</th>
    <th class="num">${esc(t("plan.h.qty"))}</th>
    <th class="num">${esc(t("plan.h.cost"))}</th>
    <th>${esc(t("plan.h.stockout"))}</th>
    <th class="num">${esc(t("plan.h.cover"))}</th>
  </tr></thead>`;
  const body = m.plan.map(p => `<tr>
    <td>${statusPill(p.status)}</td>
    <td class="name">${esc(p.name)}${p.sku && p.sku !== p.name ? ' <span style="color:var(--muted)">· ' + esc(p.sku) + "</span>" : ""}</td>
    <td>${esc(fmtDate(p.orderByDate, "long"))}</td>
    <td class="num">${esc(fmtNum(p.orderQty))}</td>
    <td class="num">${esc(fmtCurrency(p.orderCost))}</td>
    <td>${esc(p.stockoutDate ? fmtDate(p.stockoutDate, "long") : t("ui.none"))}</td>
    <td class="num">${esc(isFinite(p.cover) ? fmtNum(p.cover, 0) + " " + t("ui.days") : t("ui.none"))}</td>

    `<td class="num" style="font-weight:600">${esc(fmtCurrency(m.planCost))}</td><td colspan="2"></td></tr></tfoot>`;
  tbl.innerHTML = head + "<tbody>" + body + "</tbody>" + foot;
}

const INV_COLS = [
  { key: "name", label: "inv.h.sku", num: false },
  { key: "units", label: "inv.h.units", num: true },
  { key: "revenue", label: "inv.h.revenue", num: true },

  { key: "velocity", label: "inv.h.velocity", num: true },
  { key: "stock", label: "inv.h.stock", num: true },
  { key: "cover", label: "inv.h.cover", num: true },
  { key: "stockValue", label: "inv.h.value", num: true },
  { key: "status", label: "inv.h.status", num: false }
];

function renderInventory(m) {
  const tbl = $("#inv-table");
  const empty = $("#inv-empty");
  if (!m.products.length) {
    tbl.innerHTML = ""; empty.hidden = false; empty.textContent = t("inv.empty");
    return;
  }
  empty.hidden = true;
  const sort = STATE.sort.inv;
  const rows = m.products.slice().sort((a, b) => {
    const va = a[sort.key], vb = b[sort.key];
    if (typeof va === "string" || typeof vb === "string")
      return String(va || "").localeCompare(String(vb || ""), localeTag()) * sort.dir;
    const na = va === null || va === undefined || !isFinite(va) ? -Infinity : va;
    const nb = vb === null || vb === undefined || !isFinite(vb) ? -Infinity : vb;
    return (na - nb) * sort.dir;
  });

  const head = "<thead><tr>" + INV_COLS.map(c =>
    `<th class="sortable${c.num ? " num" : ""}" data-sort="${c.key}">${esc(t(c.label))}` +
    (sort.key === c.key ? ` <span class="arrow">${sort.dir < 0 ? "▼" : "▲"}</span>` : "") + "</th>").join("") + "</tr></thead>";

  const body = rows.map(p => `<tr>
    <td class="name">${esc(p.name)}${p.sku && p.sku !== p.name ? ' <span style="color:var(--muted)">· ' + esc(p.sku) + "</span>" : ""}</td>
    <td class="num">${esc(fmtNum(p.units))}</td>
    <td class="num">${esc(fmtCurrency(p.revenue))}</td>
    <td class="num">${esc(fmtCurrency(p.profit))}${p.costEstimated ? ' <span style="color:var(--muted)" title="' + esc(t("inv.estimated")) + '">~</span>' : ""}</td>
    <td class="num">${esc(p.margin === null ? t("ui.none") : fmtPct(p.margin, 0))}</td>
    <td class="num">${esc(fmtNum(p.velocity, 2))}</td>
    <td class="num">${esc(p.stock === null ? t("ui.none") : fmtNum(p.stock))}</td>
    <td class="num">${esc(p.cover === null ? t("ui.none") : isFinite(p.cover) ? fmtNum(p.cover, 0) : "∞")}</td>
    <td class="num">${esc(p.stockValue === null ? t("ui.none") : fmtCurrency(p.stockValue))}</td>
    <td>${statusPill(p.status)}</td>
  </tr>`).join("");

  tbl.innerHTML = head + "<tbody>" + body + "</tbody>";
  $$("#inv-table th.sortable").forEach(th => th.addEventListener("click", () => {
    const key = th.getAttribute("data-sort");
    if (STATE.sort.inv.key === key) STATE.sort.inv.dir *= -1;
    else STATE.sort.inv = { key, dir: key === "name" || key === "status" ? 1 : -1 };
    renderInventory(STATE.model);
  }));
}

    [t("kpi.orders"), String(m.totals.orderCount), ""],
    [t("kpi.stockValue"), m.stockValue.toFixed(2), c],
    [t("kpi.atRisk"), String(m.atRisk), ""],
    [t("kpi.heroLabel", { days: STATE.settings.horizon }), m.forecast.end.toFixed(2), c],
    [t("kpi.lowest"), m.forecast.lowest.balance.toFixed(2), c],
    [t("plan.totalCost", { value: "" }).replace(/[: ]+$/, ""), m.planCost.toFixed(2), c],
    [], [t("chart.bucket" + m.bucketMode.charAt(0).toUpperCase() + m.bucketMode.slice(1)), t("chart.inflow"), t("chart.outflow"), t("chart.balance")]
  ];

  downloadText(t("csv.exportName") + "-" + fmtISO(new Date()) + ".csv", toCSV(["FlowStock", "", "", ""], rows, ";"));
}

function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let x = Math.imul(seed ^ seed >>> 15, 1 | seed);
    x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x;
    return ((x ^ x >>> 14) >>> 0) / 4294967296;
  };
}

const DEMO_CHANNELS = [
  { name: "Etsy", share: 0.58, fee: 0.105 },

function demoSalesCSV(lang) {
  const de = lang === "de";
  const head = de
    ? ["Datum", "Artikelnummer", "Artikel", "Menge", "Umsatz", "Einkaufspreis", "Gebühren", "Versandkosten", "Kanal", "Bestellnummer"]
    : ["Date", "SKU", "Product", "Quantity", "Revenue", "Unit cost", "Fees", "Shipping", "Channel", "Order ID"];
  const rand = mulberry32(20240815);
  const rows = [];
  const today = startOfDay(new Date());
  let orderNo = 10001;

  for (let back = 179; back >= 0; back--) {
    const day = addDays(today, -back);
    const dow = day.getDay();
    const weekend = dow === 0 || dow === 6 ? 0.75 : 1.05;
    const trend = 0.78 + (179 - back) / 179 * 0.5;             // slow growth
    const season = 1 + 0.28 * Math.sin((179 - back) / 27);
    const orders = Math.max(0, Math.round((2.6 * weekend * trend * season) + (rand() * 2.4 - 1)));

    for (let o = 0; o < orders; o++) {
      const oid = "ORD-" + (orderNo++);
      const rc = rand();
      let acc = 0, chan = DEMO_CHANNELS[0];
      for (const c of DEMO_CHANNELS) { acc += c.share; if (rc <= acc) { chan = c; break; } }
      const lines = rand() < 0.22 ? 2 : 1;
      const shipping = 3.6 + rand() * 2.2;

      for (let l = 0; l < lines; l++) {
        const totalPop = DEMO_PRODUCTS.reduce((a, p) => a + p.pop, 0);
        let pick = rand() * totalPop, prod = DEMO_PRODUCTS[0], acc2 = 0;
        for (const p of DEMO_PRODUCTS) { acc2 += p.pop; if (pick <= acc2) { prod = p; break; } }
        const qty = rand() < 0.16 ? 2 : 1;
        const revenue = prod.price * qty;
        rows.push([
          de ? fmtDateDE(day) : fmtISO(day),
          prod.sku,
          prod.name[lang] || prod.name.en,
          String(qty),
          numOut(revenue, de),
          numOut(prod.cost, de),
          numOut(revenue * chan.fee, de),
          l === 0 ? numOut(shipping, de) : numOut(0, de),
          chan.name,
          oid
        ]);
      }
    }
  }
  return toCSV(head, rows, de ? ";" : ",");
}

function demoInventoryCSV(lang) {
  const de = lang === "de";
  const head = de
    ? ["Artikelnummer", "Artikel", "Bestand", "Einkaufspreis", "Lieferzeit", "Mindestbestellmenge", "Lieferant"]
    : ["SKU", "Product", "Stock", "Unit cost", "Lead time", "MOQ", "Supplier"];
  const rows = DEMO_PRODUCTS.map(p => [
    p.sku, p.name[lang] || p.name.en, String(p.stock), numOut(p.cost, de),
    String(p.lead), String(p.moq),
    p.sku.slice(0, 3) === "KER" ? "Studio Töpferei" : p.sku.slice(0, 3) === "PRT" ? "PrintLab" : "Manufaktur Nord"
  ]);
  return toCSV(head, rows, de ? ";" : ",");
}

function numOut(v, de) {
  const s = v.toFixed(2);
  return de ? s.replace(".", ",") : s;
}

function fmtDateDE(d) {
  const p = n => String(n).padStart(2, "0");
  return p(d.getDate()) + "." + p(d.getMonth() + 1) + "." + d.getFullYear();
}

/* ============================================================
   Settings dialog
   ============================================================ */
function fillSettingsForm() {
  const s = STATE.settings;
  $("#s-currency").value = s.currency;
  $("#s-cash").value = s.startCash;
  $("#s-fixed").value = s.fixedCosts;
  $("#s-horizon").value = String(s.horizon);
  $("#s-lead").value = s.leadTime;
  $("#s-cover").value = s.targetCover;
  $("#s-safety").value = s.safetyDays;
  $("#s-velwin").value = String(s.velWindow);
  $("#s-margin-default").value = s.defaultCost;
  $("#s-fee-default").value = s.defaultFee;
  $("#s-remember").checked = !!s.remember;
}

function readSettingsForm() {
  const num = (id, min, max, fallback) => {
    const v = parseFloat($(id).value);
    if (!isFinite(v)) return fallback;
    return Math.min(max, Math.max(min, v));
  };
  const s = STATE.settings;
  s.currency = $("#s-currency").value || "EUR";
  s.startCash = num("#s-cash", 0, 1e9, DEFAULT_SETTINGS.startCash);
  s.fixedCosts = num("#s-fixed", 0, 1e7, DEFAULT_SETTINGS.fixedCosts);
  s.horizon = Math.round(num("#s-horizon", 7, 365, DEFAULT_SETTINGS.horizon));
  s.leadTime = Math.round(num("#s-lead", 0, 365, DEFAULT_SETTINGS.leadTime));
  s.targetCover = Math.round(num("#s-cover", 1, 365, DEFAULT_SETTINGS.targetCover));
  s.safetyDays = Math.round(num("#s-safety", 0, 180, DEFAULT_SETTINGS.safetyDays));
  s.velWindow = Math.round(num("#s-velwin", 7, 365, DEFAULT_SETTINGS.velWindow));
  s.defaultCost = num("#s-margin-default", 0, 95, DEFAULT_SETTINGS.defaultCost);
  s.defaultFee = num("#s-fee-default", 0, 60, DEFAULT_SETTINGS.defaultFee);
  s.remember = $("#s-remember").checked;
  saveSettings();
  if (s.remember) persistData(); else { try { localStorage.removeItem(LS.data); } catch (e) {} }
}

/* ============================================================
   Wiring
   ============================================================ */
function debounce(fn, ms) {
  let h = null;
  return function () {
    const args = arguments;
    clearTimeout(h);
    h = setTimeout(() => fn.apply(null, args), ms);
  };
}

function init() {
  // language: stored → browser → German
  let lang = null;
  try { lang = localStorage.getItem(LS.lang); } catch (e) {}
  if (!lang) lang = (navigator.language || "de").toLowerCase().indexOf("de") === 0 ? "de" : "en";
  LANG = lang === "en" ? "en" : "de";

  let theme = null;
  try { theme = localStorage.getItem(LS.theme); } catch (e) {}
  if (!theme) theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";

  loadSettings();
  applyI18n();
  setTheme(theme);
  updateSlots();

  $("#lang-de").addEventListener("click", () => setLang("de"));
  $("#lang-en").addEventListener("click", () => setLang("en"));
  $("#btn-theme").addEventListener("click", () =>
    setTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark"));
  $("#btn-about").addEventListener("click", () => $("#dlg-about").showModal());
  $("#btn-about2").addEventListener("click", () => $("#dlg-about").showModal());
  $("#btn-help").addEventListener("click", () => $("#dlg-help").showModal());

  // file pickers
  $("#btn-pick-sales").addEventListener("click", () => $("#file-sales").click());
  $("#btn-pick-inv").addEventListener("click", () => $("#file-inv").click());
  $("#file-sales").addEventListener("change", e => { if (e.target.files[0]) handleFile(e.target.files[0], "sales"); e.target.value = ""; });
  $("#file-inv").addEventListener("change", e => { if (e.target.files[0]) handleFile(e.target.files[0], "inv"); e.target.value = ""; });
  $$("[data-clear]").forEach(btn => btn.addEventListener("click", () => {
    const k = btn.getAttribute("data-clear");
    if (k === "sales") { STATE.salesRaw = null; STATE.salesMap = null; STATE.fileNames.sales = null; }
    else { STATE.invRaw = null; STATE.invMap = null; STATE.fileNames.inv = null; }
    updateSlots();
  }));

  // drag & drop
  const dz = $("#dropzone");
  ["dragenter", "dragover"].forEach(ev => dz.addEventListener(ev, e => {
    e.preventDefault(); dz.classList.add("is-over");
  }));
  ["dragleave", "drop"].forEach(ev => dz.addEventListener(ev, e => {
    e.preventDefault(); if (ev === "dragleave" && dz.contains(e.relatedTarget)) return;
    dz.classList.remove("is-over");
  }));
  dz.addEventListener("drop", e => {
    const files = Array.prototype.slice.call(e.dataTransfer.files || []);
    if (!files.length) return;
    // first file is the sales export, a second one is treated as stock
    handleFile(files[0], STATE.salesRaw ? "inv" : "sales").then(() => {
      if (files[1]) handleFile(files[1], "inv");
    });
  });

  $("#btn-demo").addEventListener("click", loadDemo);
  $("#btn-sample-sales").addEventListener("click", () =>
    downloadText("flowstock-sample-sales-" + LANG + ".csv", demoSalesCSV(LANG)));
  $("#btn-sample-inv").addEventListener("click", () =>
    downloadText("flowstock-sample-stock-" + LANG + ".csv", demoInventoryCSV(LANG)));

  // mapping dialog
  $("#dlg-map").addEventListener("close", () => {
    if ($("#dlg-map").returnValue !== "apply") return;
    const maps = readMapping();
    if (!maps.sales.date || (!maps.sales.revenue && !maps.sales.price)) {
      showLandingError(t("err.mapRequired"));
      return;
    }
    STATE.salesMap = maps.sales;
    STATE.invMap = STATE.invRaw && maps.inv.sku && maps.inv.stock ? maps.inv : null;
    buildAndRender();
  });

  // settings dialog
  $("#btn-settings").addEventListener("click", () => { fillSettingsForm(); $("#dlg-settings").showModal(); });
  $("#dlg-settings").addEventListener("close", () => {
    if ($("#dlg-settings").returnValue !== "save") return;
    readSettingsForm();
    render();
  });
  $("#btn-clear-storage").addEventListener("click", () => {
    clearStoredData();
    $("#s-remember").checked = false;
    $("#btn-clear-storage").textContent = t("set.cleared");
    setTimeout(() => { $("#btn-clear-storage").textContent = t("set.clearStorage"); }, 2200);
  });

  $("#btn-reset").addEventListener("click", () => {
    STATE.salesRaw = STATE.salesMap = STATE.invRaw = STATE.invMap = null;
    STATE.sales = STATE.inventory = STATE.model = null;
    STATE.fileNames = { sales: null, inv: null };
    try { localStorage.removeItem(LS.data); } catch (e) {}
    updateSlots();
    showLandingError("");
    $("#view-dash").hidden = true;
    $("#view-landing").hidden = false;
    $("#btn-settings").hidden = true;
    $("#btn-reset").hidden = true;
    window.scrollTo(0, 0);
  });

  // filters
  $("#f-range").addEventListener("change", e => { STATE.filters.range = e.target.value; render(); });
  $("#f-channel").addEventListener("change", e => { STATE.filters.channel = e.target.value; render(); });
  $("#f-search").addEventListener("input", debounce(e => { STATE.filters.search = e.target.value; render(); }, 220));

  $("#btn-export").addEventListener("click", exportSummary);
  $("#btn-export-plan").addEventListener("click", exportPlan);
  $("#btn-export-inv").addEventListener("click", exportInventory);
  $("#btn-print").addEventListener("click", () => window.print());

  // chart / table toggles
  $$("[data-view-for]").forEach(group => {
    const name = group.getAttribute("data-view-for");
    group.addEventListener("click", e => {
      const btn = e.target.closest("button[data-view]");
      if (!btn) return;
      const view = btn.getAttribute("data-view");
      STATE.views[name] = view;
      group.querySelectorAll("button").forEach(b => b.setAttribute("aria-selected", String(b === btn)));
      $("#" + name + "-chart").hidden = view !== "chart";
      $("#" + name + "-table").hidden = view !== "table";
      const legend = $("#" + name + "-legend");
      if (legend) legend.hidden = view !== "chart";
      if (view === "chart") renderCharts();
    });
  });

  window.addEventListener("resize", debounce(() => { if (STATE.model) renderCharts(); }, 180));

  restoreData();
}

if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
else init();
