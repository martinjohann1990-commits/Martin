# English UI strings. No user-facing text may live in the Python code -
# every label, heading and note comes from this file (or strings_de.yaml).
meta:
  workbook_title: "Peak Season Planner"
  file_suffix: EN

common:
  yes: "Yes"
  no: "No"
  active: "Active"
  inactive: "Inactive"
  na: "n/a"
  currency_symbol: "$"

start:
  sheet_title: "Start"
  heading: "Peak Season Planner"
  intro: >-
    This workbook turns your Etsy order history into a week-by-week plan:
    how much of each product you will sell over the coming weeks, when you
    need to produce it, when to order materials, whether your work hours
    are enough, and how much capital it ties up.
  steps_heading: "Three steps"
  steps:
    - "Paste your Etsy order export into the Import sheet (or enter monthly totals by hand)."
    - "Fill in your products and materials on the Products and Materials sheets."
    - "Read Forecast, Production, Materials, Cash and Dashboard - everything updates automatically."
  example_note: "See the Example sheet for a fully filled-in walkthrough with sample data."
  method_note: "Every calculation is explained in plain language on the hidden Method sheet."

settings:
  sheet_title: "Settings"
  heading: "Settings"
  intro: "These values drive every calculation in this workbook. Change them here, not in a formula."
  section_general: "General"
  section_planning: "Planning"
  section_service: "Service level & growth"
  section_production: "Production"
  labels:
    currency: "Currency"
    start_date: "Planning start date"
    horizon_weeks: "Planning horizon (weeks)"
    work_hours_week: "Available work hours per week"
    work_hours_overrides: "Week overrides (holidays etc.)"
    service_level: "Service level"
    service_z: "Service level z-value"
    growth_pct: "Growth assumption"
    cure_days: "Cure time (days)"
    lead_time_buffer_days: "Lead time safety buffer (days)"
    fee_rate: "Marketplace fee rate"
    scenario: "Scenario"
    scenario_z: "Scenario band coefficient"
  service_level_options:
    cautious: "Cautious (95%)"
    normal: "Normal (90%)"
    lean: "Lean (80%)"
  scenario_options:
    low: "Low"
    expected: "Expected"
    high: "High"
  units:
    days: "days"
    hours_per_week: "hours/week"
    weeks: "weeks"
    percent: "%"

