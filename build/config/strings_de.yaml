start:
  sheet_title: "Start"
  heading: "Peak Season Planner"
  intro: >-
    Diese Arbeitsmappe macht aus deiner Etsy-Bestellhistorie einen
    Wochenplan: wie viel du je Artikel in den nächsten Wochen verkaufst,
    wann du produzieren musst, wann du Material bestellst, ob deine
    Arbeitszeit reicht und wie viel Kapital das bindet.
  steps_heading: "Drei Schritte"
  steps:
    - "Füge deinen Etsy-Bestellexport in das Blatt Import ein (oder trage Monatswerte von Hand ein)."
    - "Trage deine Artikel und Materialien in Products und Materials ein."
    - "Lies Forecast, Production, Materials, Cash und Dashboard - alles aktualisiert sich automatisch."
  example_note: "Ein vollständig ausgefülltes Beispiel findest du im Blatt Example."
  method_note: "Jede Berechnung ist im ausgeblendeten Blatt Method in Klartext erklärt."

