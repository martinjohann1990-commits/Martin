<header class="topbar no-print">
  <div class="wrap topbar-in">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 32 32" fill="#fff"><path d="M9 21.5V15h3.4v6.5H9Zm5.3 0V10h3.4v11.5h-3.4Zm5.3 0v-9h3.4v9h-3.4Z"/></svg>
      </span>
      <span class="brand-name">FlowStock</span>
      <span class="brand-tag" data-i18n="app.tagline"></span>
    </div>

    <button class="btn btn-sm" id="btn-settings" hidden>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 7 19.4a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0-1.2-2.9H1a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 2.6 7a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H7a1.7 1.7 0 0 0 1-1.5V1a2 2 0 1 1 4 0v.1A1.7 1.7 0 0 0 15 2.6a1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V7a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z" transform="translate(1 1) scale(0.92)"/></svg>
      <span data-i18n="nav.settings"></span>
    </button>

    <button class="btn btn-sm" id="btn-reset" hidden>
      <span data-i18n="nav.newFile"></span>
    </button>

    <div class="seg" role="group" aria-label="Sprache / Language">
      <button type="button" id="lang-de" data-lang="de">DE</button>
      <button type="button" id="lang-en" data-lang="en">EN</button>
    </div>

    <button class="btn btn-icon btn-sm" id="btn-theme" aria-label="Theme">
      <svg id="ic-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg>
      <svg id="ic-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true" hidden><path d="M20 13.5A8 8 0 0 1 10.5 4a8.2 8.2 0 0 0-1 4 8 8 0 0 0 8 8 8.2 8.2 0 0 0 2.5-.4Z"/></svg>
    </button>

    <button class="btn btn-icon btn-sm" id="btn-about" aria-label="Info">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><circle cx="12" cy="12" r="9.2"/><path d="M12 11v5.5M12 7.6v.9"/></svg>
    </button>
  </div>
</header>

<main>
<!-- =========================== LANDING =========================== -->
<section id="view-landing" class="wrap">
  <div class="hero-land">
    <h1 data-i18n="landing.title"></h1>
    <p class="lede" data-i18n="landing.lede"></p>
    <div class="badges">
      <span class="badge"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="10.5" width="16" height="10" rx="2.2"/><path d="M8 10.5V7.6a4 4 0 0 1 8 0v2.9"/></svg><span data-i18n="landing.badge1"></span></span>
      <span class="badge"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg><span data-i18n="landing.badge2"></span></span>
      <span class="badge"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 12a9 9 0 1 0 18 0 9 9 0 0 0-18 0M3 12h18M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18"/></svg><span data-i18n="landing.badge3"></span></span>
    </div>
  </div>

  <div class="drop" id="dropzone">
    <h3 data-i18n="landing.dropTitle"></h3>
    <p data-i18n="landing.dropHint"></p>
    <div class="drop-actions">
      <button class="btn btn-primary" id="btn-pick-sales" data-i18n="landing.pickSales"></button>
      <button class="btn" id="btn-pick-inv" data-i18n="landing.pickInv"></button>
      <button class="btn btn-ghost" id="btn-demo" data-i18n="landing.demo"></button>
    </div>
    <input type="file" id="file-sales" accept=".csv,.txt,text/csv" hidden>
    <input type="file" id="file-inv" accept=".csv,.txt,text/csv" hidden>
    <div class="upload-grid">
      <div class="file-slot" id="slot-sales"><span class="dot"></span><span class="nm" data-i18n="landing.slotSalesEmpty"></span><button class="btn btn-sm btn-ghost" data-clear="sales" hidden>×</button></div>
      <div class="file-slot" id="slot-inv"><span class="dot"></span><span class="nm" data-i18n="landing.slotInvEmpty"></span><button class="btn btn-sm btn-ghost" data-clear="inv" hidden>×</button></div>
    </div>
    <div id="landing-error" class="notice err" style="margin-top:14px;text-align:left" hidden>
      <span class="ic" aria-hidden="true">!</span><span id="landing-error-text"></span>
    </div>
  </div>

  <div style="display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap">
    <button class="btn btn-sm btn-ghost" id="btn-sample-sales" data-i18n="landing.sampleSales"></button>
    <button class="btn btn-sm btn-ghost" id="btn-sample-inv" data-i18n="landing.sampleInv"></button>
    <button class="btn btn-sm btn-ghost" id="btn-help" data-i18n="landing.helpCsv"></button>
  </div>

  <div class="features">
    <div class="feature card" style="padding:18px">
      <div class="ic" aria-hidden="true"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17.5 9 11l4 4 8-8.5"/><path d="M15.5 6.5H21v5.5"/></svg></div>
      <h4 data-i18n="landing.f1t"></h4><p data-i18n="landing.f1d"></p>
    </div>
    <div class="feature card" style="padding:18px">
      <div class="ic" aria-hidden="true"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3.5 7.5 12 3l8.5 4.5v9L12 21l-8.5-4.5z"/><path d="M3.5 7.5 12 12l8.5-4.5M12 12v9"/></svg></div>
      <h4 data-i18n="landing.f2t"></h4><p data-i18n="landing.f2d"></p>
    </div>
    <div class="feature card" style="padding:18px">
      <div class="ic" aria-hidden="true"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8.5"/><path d="M12 6.8v5.4l3.4 2"/></svg></div>
      <h4 data-i18n="landing.f3t"></h4><p data-i18n="landing.f3d"></p>
    </div>
  </div>
</section>

<!-- =========================== DASHBOARD =========================== -->
<section id="view-dash" class="wrap" hidden>

  <div class="filters no-print">
    <div class="field grow"><label for="f-range" data-i18n="filter.range"></label>
      <select id="f-range">
        <option value="all" data-i18n="filter.rangeAll"></option>
        <option value="30" data-i18n="filter.range30"></option>
        <option value="90" data-i18n="filter.range90"></option>
        <option value="180" data-i18n="filter.range180"></option>
        <option value="365" data-i18n="filter.range365"></option>
      </select>
    </div>
    <div class="field grow"><label for="f-channel" data-i18n="filter.channel"></label>
      <select id="f-channel"></select>
    </div>
    <div class="field grow"><label for="f-search" data-i18n="filter.search"></label>
      <input type="text" id="f-search" autocomplete="off">
    </div>
    <div class="spacer"></div>
    <button class="btn" id="btn-export" data-i18n="filter.export"></button>
    <button class="btn" id="btn-print" data-i18n="filter.print"></button>
  </div>

  <div id="dash-warn" class="notice" style="margin-bottom:16px" hidden>
    <span class="ic" aria-hidden="true">i</span><span id="dash-warn-text"></span>
  </div>

  <!-- hero -->
  <div class="card hero-figure">
    <div>
      <div class="lab" data-i18n="kpi.heroLabel"></div>
      <div class="val" id="hero-val">—</div>
      <div class="sub" id="hero-sub"></div>
    </div>
    <div class="hero-side">
      <div><div class="k" data-i18n="kpi.today"></div><div class="v" id="hero-today">—</div></div>
      <div><div class="k" data-i18n="kpi.lowest"></div><div class="v" id="hero-low">—</div></div>
      <div><div class="k" data-i18n="kpi.runway"></div><div class="v" id="hero-runway">—</div></div>
    </div>
  </div>

  <!-- stat tiles -->
  <div class="tiles">
    <div class="card tile"><div class="lab" data-i18n="kpi.revenue"></div><div class="val" id="k-rev">—</div><div class="delta" id="k-rev-d"></div></div>
    <div class="card tile"><div class="lab" data-i18n="kpi.profit"></div><div class="val" id="k-profit">—</div><div class="delta" id="k-profit-d"></div></div>
    <div class="card tile"><div class="lab" data-i18n="kpi.margin"></div><div class="val" id="k-margin">—</div><div class="delta" id="k-margin-d"></div></div>
    <div class="card tile"><div class="lab" data-i18n="kpi.orders"></div><div class="val" id="k-orders">—</div><div class="delta" id="k-orders-d"></div></div>
    <div class="card tile"><div class="lab" data-i18n="kpi.stockValue"></div><div class="val" id="k-stock">—</div><div class="delta" id="k-stock-d"></div></div>
    <div class="card tile"><div class="lab" data-i18n="kpi.atRisk"></div><div class="val" id="k-risk">—</div><div class="delta" id="k-risk-d"></div></div>
  </div>

  <!-- charts row 1 -->
  <div class="chart-grid">
    <section class="card">
      <div class="card-head">
        <div class="titles"><h3 class="card-title" data-i18n="chart.flowTitle"></h3><p class="card-sub" data-i18n="chart.flowSub"></p></div>
        <div class="tabs no-print" role="tablist" data-view-for="flow">
          <button role="tab" aria-selected="true" data-view="chart" data-i18n="ui.chart"></button>
          <button role="tab" aria-selected="false" data-view="table" data-i18n="ui.table"></button>
        </div>
      </div>
      <div class="card-body">
        <div class="chart-wrap" id="flow-chart"></div>
        <div id="flow-table" hidden></div>
        <div class="legend" id="flow-legend"></div>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <div class="titles"><h3 class="card-title" data-i18n="chart.cashTitle"></h3><p class="card-sub" data-i18n="chart.cashSub"></p></div>
        <div class="tabs no-print" role="tablist" data-view-for="cash">
          <button role="tab" aria-selected="true" data-view="chart" data-i18n="ui.chart"></button>
          <button role="tab" aria-selected="false" data-view="table" data-i18n="ui.table"></button>
        </div>
      </div>
      <div class="card-body">
        <div class="chart-wrap" id="cash-chart"></div>
        <div id="cash-table" hidden></div>
        <div class="legend" id="cash-legend"></div>
      </div>
    </section>
  </div>

  <!-- charts row 2 -->
  <div class="chart-grid">
    <section class="card">
      <div class="card-head">
        <div class="titles"><h3 class="card-title" data-i18n="chart.skuTitle"></h3><p class="card-sub" data-i18n="chart.skuSub"></p></div>
        <div class="tabs no-print" role="tablist" data-view-for="sku">
          <button role="tab" aria-selected="true" data-view="chart" data-i18n="ui.chart"></button>
          <button role="tab" aria-selected="false" data-view="table" data-i18n="ui.table"></button>
        </div>
      </div>
      <div class="card-body">
        <div class="chart-wrap" id="sku-chart"></div>
        <div id="sku-table" hidden></div>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <div class="titles"><h3 class="card-title" data-i18n="chart.chanTitle"></h3><p class="card-sub" data-i18n="chart.chanSub"></p></div>
        <div class="tabs no-print" role="tablist" data-view-for="chan">
          <button role="tab" aria-selected="true" data-view="chart" data-i18n="ui.chart"></button>
          <button role="tab" aria-selected="false" data-view="table" data-i18n="ui.table"></button>
        </div>
      </div>
      <div class="card-body">
        <div class="chart-wrap" id="chan-chart"></div>
        <div id="chan-table" hidden></div>
      </div>
    </section>
  </div>

  <!-- restock plan -->
  <section class="card" style="margin-bottom:18px">
    <div class="card-head">
      <div class="titles"><h3 class="card-title" data-i18n="plan.title"></h3><p class="card-sub" data-i18n="plan.sub"></p></div>
      <button class="btn btn-sm no-print" id="btn-export-plan" data-i18n="plan.export"></button>
    </div>
    <div class="card-body" style="padding-left:0;padding-right:0">
      <div class="table-scroll"><table class="data" id="plan-table"></table></div>
      <div class="empty" id="plan-empty" hidden data-i18n="plan.empty"></div>
    </div>
  </section>

  <!-- inventory -->
  <section class="card" style="margin-bottom:18px">
    <div class="card-head">
      <div class="titles"><h3 class="card-title" data-i18n="inv.title"></h3><p class="card-sub" data-i18n="inv.sub"></p></div>
      <button class="btn btn-sm no-print" id="btn-export-inv" data-i18n="inv.export"></button>
    </div>
    <div class="card-body" style="padding-left:0;padding-right:0">
      <div class="table-scroll"><table class="data" id="inv-table"></table></div>
      <div class="empty" id="inv-empty" hidden data-i18n="inv.empty"></div>
    </div>
  </section>
</section>
</main>

<footer class="foot wrap">
  <p><span data-i18n="foot.line"></span> · <button class="btn btn-sm btn-ghost" id="btn-about2" data-i18n="foot.license"></button></p>
</footer>

<!-- =========================== DIALOGS =========================== -->
<dialog class="sheet" id="dlg-map">
  <form method="dialog">
    <div class="sheet-head"><h2 data-i18n="map.title"></h2></div>
    <div class="sheet-body">
      <p class="prose" data-i18n="map.intro"></p>
      <div class="sec-title" data-i18n="map.salesSec"></div>
      <div id="map-sales"></div>
      <div id="map-inv-block" hidden>
        <div class="sec-title" data-i18n="map.invSec"></div>
        <div id="map-inv"></div>
      </div>
      <div id="map-error" class="notice err" style="margin-top:14px" hidden><span class="ic">!</span><span id="map-error-text"></span></div>
    </div>
    <div class="sheet-foot">
      <button class="btn" value="cancel" data-i18n="ui.cancel"></button>
      <button class="btn btn-primary" id="map-apply" value="apply" data-i18n="map.apply"></button>
    </div>
  </form>
</dialog>

<dialog class="sheet" id="dlg-settings">
  <form method="dialog">
    <div class="sheet-head"><h2 data-i18n="set.title"></h2></div>
    <div class="sheet-body">
      <div class="sec-title" data-i18n="set.secGeneral"></div>
      <div class="form-grid">
        <div class="field"><label for="s-currency" data-i18n="set.currency"></label>
          <select id="s-currency">
            <option value="EUR">EUR €</option><option value="USD">USD $</option><option value="GBP">GBP £</option>
            <option value="CHF">CHF</option><option value="SEK">SEK</option><option value="PLN">PLN</option>
            <option value="CAD">CAD $</option><option value="AUD">AUD $</option>
          </select>
        </div>
        <div class="field"><label for="s-cash" data-i18n="set.startCash"></label>
          <input type="number" id="s-cash" min="0" step="50"><span class="hint" data-i18n="set.startCashHint"></span>
        </div>
        <div class="field"><label for="s-fixed" data-i18n="set.fixedCosts"></label>
          <input type="number" id="s-fixed" min="0" step="10"><span class="hint" data-i18n="set.fixedCostsHint"></span>
        </div>
        <div class="field"><label for="s-horizon" data-i18n="set.horizon"></label>
          <select id="s-horizon"><option value="30">30</option><option value="60">60</option><option value="90">90</option><option value="180">180</option></select>
          <span class="hint" data-i18n="set.horizonHint"></span>
        </div>
      </div>

      <div class="sec-title" data-i18n="set.secStock"></div>
      <div class="form-grid">
        <div class="field"><label for="s-lead" data-i18n="set.lead"></label>
          <input type="number" id="s-lead" min="0" max="365" step="1"><span class="hint" data-i18n="set.leadHint"></span>
        </div>
        <div class="field"><label for="s-cover" data-i18n="set.cover"></label>
          <input type="number" id="s-cover" min="1" max="365" step="1"><span class="hint" data-i18n="set.coverHint"></span>
        </div>
        <div class="field"><label for="s-safety" data-i18n="set.safety"></label>
          <input type="number" id="s-safety" min="0" max="180" step="1"><span class="hint" data-i18n="set.safetyHint"></span>
        </div>
        <div class="field"><label for="s-velwin" data-i18n="set.velWindow"></label>
          <select id="s-velwin"><option value="14">14</option><option value="30">30</option><option value="60">60</option><option value="90">90</option></select>
          <span class="hint" data-i18n="set.velWindowHint"></span>
        </div>
        <div class="field"><label for="s-margin-default" data-i18n="set.defaultCost"></label>
          <input type="number" id="s-margin-default" min="0" max="95" step="1"><span class="hint" data-i18n="set.defaultCostHint"></span>
        </div>
        <div class="field"><label for="s-fee-default" data-i18n="set.defaultFee"></label>
          <input type="number" id="s-fee-default" min="0" max="60" step="0.5"><span class="hint" data-i18n="set.defaultFeeHint"></span>
        </div>
      </div>

      <div class="sec-title" data-i18n="set.secData"></div>
      <div class="field">
        <label style="display:flex;align-items:center;gap:9px;font-weight:500;font-size:14px;cursor:pointer">
          <input type="checkbox" id="s-remember" style="width:auto"><span data-i18n="set.remember"></span>
        </label>
        <span class="hint" data-i18n="set.rememberHint"></span>
      </div>
      <div style="margin-top:14px"><button type="button" class="btn btn-sm" id="btn-clear-storage" data-i18n="set.clearStorage"></button></div>
    </div>
    <div class="sheet-foot">
      <button class="btn" value="cancel" data-i18n="ui.cancel"></button>
      <button class="btn btn-primary" value="save" id="set-save" data-i18n="ui.save"></button>
    </div>
  </form>
</dialog>

<dialog class="sheet" id="dlg-about">
  <form method="dialog">
    <div class="sheet-head"><h2 data-i18n="about.title"></h2></div>
    <div class="sheet-body prose" id="about-body"></div>
    <div class="sheet-foot"><button class="btn btn-primary" value="ok" data-i18n="ui.close"></button></div>
  </form>
</dialog>

<dialog class="sheet" id="dlg-help">
  <form method="dialog">
    <div class="sheet-head"><h2 data-i18n="help.title"></h2></div>
    <div class="sheet-body prose" id="help-body"></div>
    <div class="sheet-foot"><button class="btn btn-primary" value="ok" data-i18n="ui.close"></button></div>
  </form>
</dialog>
