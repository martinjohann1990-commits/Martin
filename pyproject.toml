[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kleinanzeigen-tool"
version = "0.1.0"
description = "Erstellt aus Fotos automatisch ein fertiges Kleinanzeigen-Inserat (Titel, Beschreibung, Kategorie, Preis)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# Bewusst schlank: pro Anbieter ein eigenes Extra. Das Anthropic-SDK zieht
# `jiter` nach (eine Rust-Erweiterung), und wer nur Gemini nutzt, soll die auf
# Geräten ohne Fertigpaket — etwa Android/Termux — nicht übersetzen müssen.
dependencies = [
    "pydantic>=2.6",
    "pillow>=10.2",
]

[project.optional-dependencies]
claude = ["anthropic>=0.69"]
gemini = ["google-genai>=1.0"]
all = ["anthropic>=0.69", "google-genai>=1.0"]
browser = ["playwright>=1.44"]
dev = ["pytest>=8.0", "anthropic>=0.69", "google-genai>=1.0"]

[project.scripts]
kleinanzeigen = "kleinanzeigen_tool.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kleinanzeigen_tool = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
