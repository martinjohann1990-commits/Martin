[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kleinanzeigen-tool"
version = "0.1.0"
description = "Erstellt aus Fotos automatisch ein fertiges Kleinanzeigen-Inserat (Titel, Beschreibung, Kategorie, Preis)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.69",
    "pydantic>=2.6",
    "pillow>=10.2",
]

[project.optional-dependencies]
browser = ["playwright>=1.44"]
gemini = ["google-genai>=1.0"]
dev = ["pytest>=8.0", "google-genai>=1.0"]

[project.scripts]
kleinanzeigen = "kleinanzeigen_tool.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
